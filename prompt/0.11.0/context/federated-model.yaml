# Федеративная модель применения ИИ в разработке СИГМА.MES+ (как устроено сейчас).
# Источник: решения владельца применения ИИ, зафиксированные при подготовке стратегии (сентябрь 2026).
model: federated
summary: >
  Компания публикует знание проекта и задаёт условия применения ИИ. Сотрудник работает с ИИ
  на персональном ПК; соблюдение правил на ПК технически не контролируется.

zones:
  personal_pc:
    control: нет технического контроля компании
    contains:
      - ChatGPT для десктопа — режимы Codex и Work (локальный агент)
      - Codex CLI и Codex IDE
      - установленный плагин sigma-mes-skills
      - локальная копия рабочего репозитория документации и кода
    network: VPN до защищённого сегмента
    note: >
      Обычный режим чата ChatGPT работает из облака и защищённый сегмент не видит.
      Для работы с материалами проекта он не используется.
  protected_segment:
    control: под контролем компании
    access: только через VPN
    contains:
      - id: gitlab
        what: локальный GitLab; папка /docs — опубликованные MD-редакции (знание проекта по RULE-AI-002)
      - id: ci_cd
        what: GitLab CI/CD
      - id: term_registry
        what: реестр терминов на OpenMetadata; доступ средств ИИ через MCP по HTTPS с авторизацией
  external_cloud:
    control: внешняя зона
    contains:
      - модели OpenAI
    data_flow: всё, что прочитал агент на ПК, передаётся модели как часть запроса

centrally_managed_assets:
  - Конституция разработки как правила генерации плагина
  - реестр терминов (MCP)
  - опубликованные редакции в GitLab /docs
not_controlled:
  - установлен ли плагин и какой версии (плагин сам сверяет версию Конституции, D-07)
  - какие материалы агент прочитал в сеансе
  - память и история диалогов (знанием проекта не являются, RULE-AI-002)

session_flow:
  - step: 1
    name: Публикация знания проекта
    zone: protected_segment
    who: профильные роли; публикует ROLE-DOCUMENTATION-OWNER
  - step: 2
    name: Выпуск пакета правил (плагин)
    zone: protected_segment
    who: разрешает ROLE-AI-USE-CASE-OWNER (инструкция — условие RULE-AI-001)
  - step: 3
    name: Подбор контекста
    zone: personal_pc
    who: сотрудник; по правилам — только действующие редакции и реестр
  - step: 4
    name: Выполнение
    zone: personal_pc
    who: сотрудник; ИИ готовит материал, не решает
  - step: 5
    name: Приёмка и гейт
    zone: protected_segment
    who: профильные роли; решение GO / REWORK / STOP — ответственная роль гейта
  - step: 6
    name: Публикация изменений
    zone: protected_segment
    who: утверждает профильная роль; публикует ROLE-DOCUMENTATION-OWNER
