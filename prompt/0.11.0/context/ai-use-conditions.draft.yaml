# ПРОЕКТ условий применения ИИ по RULE-AI-001. НЕ УТВЕРЖДЁН.
# Утверждает: ROLE-AI-USE-CASE-OWNER. Нужно заключение ROLE-SECURITY-OWNER (RULE-SECURITY-001:
# требования законодательства и документов СИГМА и Интер РАО в области ИБ).
# Публикует: ROLE-DOCUMENTATION-OWNER в /docs по пути, указанному в sigma-mes.config.yaml (paths.ai_use_conditions).
# В плагин этот файл не копируется (D-08): навыки читают опубликованную редакцию.
document: Условия применения ИИ в разработке СИГМА.MES+
basis: [RULE-AI-001, RULE-AI-002, RULE-TERM-003, RULE-SECURITY-001]
status_note: проект; до утверждения навыки работают только если опубликованная редакция существует

tasks_allowed:
  - подготовка материалов ролей ROLE-PRODUCT-OWNER, ROLE-FUNCTIONAL-ARCHITECT, ROLE-TECHNICAL-ARCHITECT
  - подготовка пакетов гейтов и проектов заключений ролей
  - проверка согласованности терминологии (без изменения статусов, раздел 5.2)
  - подготовка кода и технической документации разработчиком (вне состава этого плагина)

model:
  provider: OpenAI
  clients_allowed:
    - ChatGPT для десктопа — режимы Codex и Work
    - Codex CLI
    - Codex IDE
  clients_not_allowed_for_project_materials:
    - обычный режим чата ChatGPT
    - облачные задачи Codex

sources_allowed:
  - действующие редакции правил, терминов, требований и решений в GitLab /docs, опубликованные ROLE-DOCUMENTATION-OWNER (RULE-AI-002)
  - реестр терминов через MCP-сервер sigma_terms, только инструменты чтения (RULE-TERM-003)
  - исходный код продукта в GitLab

data_allowed:
  - знание проекта в смысле RULE-AI-002
  - исходный код продукта

data_prohibited:
  - производственные данные предприятий
  - персональные данные
  - учётные данные, токены, ключи и иные секреты
  - договорные документы заказчиков

instruction:
  plugin: sigma-mes-skills
  version: 0.11.0
  source: <HTTPS-адрес репозитория плагина в GitLab>

verification:
  - материал, подготовленный ИИ, проверяет и утверждает профильная роль (RULE-AI-001)
  - функциональная приёмка и гейты — по Конституции; результат ИИ сам по себе основанием не является (раздел 3.1)
  - CI в GitLab

autonomy_limits:
  - ИИ не записывает в реестр терминов и не меняет статусы терминов
  - ИИ не записывает решения, исходы и утверждения без явной реплики человека в соответствующей роли
  - ИИ не восполняет пробел в знании проекта собственными знаниями (RULE-AI-002)

revalidation: >
  Смена модели, клиентов, источников, данных, инструкции (версии плагина) или способа проверки
  требует повторного разрешения ROLE-AI-USE-CASE-OWNER (RULE-AI-001).
