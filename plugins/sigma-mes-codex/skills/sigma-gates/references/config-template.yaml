# sigma-mes.config.yaml — конфигурация рабочего репозитория для плагина sigma-mes-skills.
# Скопировать в корень рабочего репозитория документации. Заполнить все значения вида <...>.
# Пока остаётся хотя бы один заполнитель, навыки не создают нормативных материалов (D-06).
config_version: 1
product_id: <идентификатор продукта, например sigma-mes>

paths:
  # Опубликованные материалы (публикует ROLE-DOCUMENTATION-OWNER). Только чтение.
  constitution: <путь к опубликованной Конституции разработки, .md>
  acceptance_regulation: <путь к опубликованному Регламенту функциональной приёмки, .md>
  role_registry: <путь к опубликованному Реестру назначений ролей, .md>
  ai_use_conditions: <путь к опубликованным условиям применения ИИ, .yaml>
  # Каталоги материалов ролей (проекты материалов создаются здесь; публикация — по процессу ROLE-DOCUMENTATION-OWNER).
  product_description: <каталог описания продукта>
  enterprise_variants: <каталог вариантов для предприятий>
  po_decisions: <каталог решений владельца продукта>
  constitution_change_proposals: <каталог предложений об изменении Конституции>
  functional_architecture: <каталог функциональной архитектуры по модулям>
  functional_requirements: <каталог функциональных требований>
  technical_constraints: <каталог технических ограничений>
  quality_requirements: <каталог требований к качеству>
  end_to_end_scenarios: <каталог сквозных сценариев>
  test_design: <каталог тест-дизайна>
  functional_acceptance: <каталог записей функциональной приёмки>
  fa_changes: <каталог изменений функциональной архитектуры>
  fa_questions_log: <файл журнала вопросов к функциональным архитекторам (RULE-REQ-004)>
  practice_reviews: <каталог обзоров практик>
  adr: <каталог технических архитектурных решений>
  c4: <каталог модели C4 (workspace.dsl)>
  deployment_architecture: <каталог архитектуры развёртывания>
  scope_returns: <каталог возвратов отнесения к модулям>
  term_proposals: <каталог предложений терминов>
  gates: <каталог пакетов гейтов, заключений и решений>

mcp:
  terms_server: sigma_terms
