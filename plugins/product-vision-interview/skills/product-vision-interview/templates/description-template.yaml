# Машинная проекция продуктового описания (description.yaml).
# Пустая схема: скалярные поля документа и семь массивов.
# Ключи — латиницей; значения (в том числе значения type и confirmation_status) —
# на русском языке, дословно как в перечнях references/statuses.md.
# Экспорт в этот файл не повышает статус подтверждения, не добавляет факт,
# которого нет в модели, и не заполняет поле, которое в модели пусто.

# --- Верхнеуровневые поля документа ---

product_id:              # идентификатор продукта, используется в пути хранения docs/product/<product-id>/
description_version:     # номер версии описания для человеческого чтения, например "0.1"
document_status:         # черновик | незавершённый черновик
date:                    # дата текущей версии, ГГГГ-ММ-ДД
constitution_revision:   # редакция Конституции СИГМА.MES+, на которую опирается версия, например "v0.6"

# Владелец содержания указывается в шапке description.md, но не входит в верхнеуровневые
# поля этой схемы — это осознанно оставлено открытым вопросом, а не восполнено
# произвольно добавленным полем.

# --- Массив statements ---
# Каждый элемент — одно положение продуктового описания, независимо от того,
# к какому блоку человеческой проекции (description.md) оно относится.
# Пример ниже закомментирован и показывает все поля, включая awaiting.

statements: []
  # - id: ST-001                        # устойчивый идентификатор положения; сохраняется между версиями документа
  #   text: "<текст положения на русском языке>"
  #   type: "продуктовый выбор"         # наблюдаемый факт | гипотеза | продуктовый выбор | продуктовое ограничение | иллюстрация замысла
  #   confirmation_status: "ожидает заключения роли"
  #     # утверждено владельцем продукта | зафиксировано как предложение | открытый вопрос |
  #     # ожидает заключения роли | ответ роли зафиксирован | требует перепроверки
  #     # "утверждено владельцем продукта" допустимо только для назначения, ценности и продуктовых границ
  #   formulated_by: "пользователь"      # пользователь | ИИ
  #   awaiting:                          # заполняется ТОЛЬКО при confirmation_status "ожидает заключения роли"
  #                                      # или "ответ роли зафиксирован"; при любом другом статусе поле отсутствует целиком
  #     role: ROLE-ARCHITECT             # код роли из утверждённого перечня
  #     module: M04                      # M01–M13 либо "не определено" (само по себе порождает открытый вопрос)
  #   source: "<ссылка на письмо, реплику в чате или документ>"
  #     # обязательно при confirmation_status "ответ роли зафиксирован"; иначе поле отсутствует
  #   related: []                        # список id связанных положений, может быть пустым
  #   section: 5                         # номер раздела (1–9), к которому относится положение

# --- Массив open_questions ---
# Положение требует ответа, которого пока нет ни от пользователя, ни от роли, ни из источника.

open_questions: []
  # поля элемента: id, text, formulated_by (пользователь | ИИ),
  # section (раздел 1–9, если вопрос относится к конкретному разделу; для процессных
  # вопросов поле отсутствует), related (связанные id из statements, может быть пустым)

# --- Массив role_requests ---
# Запрос заключения роли. Три поля обязательны всегда: text (что именно требуется
# подтвердить), blocks (какое продуктовое решение блокируется до ответа) и if_declined
# (что произойдёт при отрицательном ответе). Без любого из них запрос не считается
# готовым и не формируется.

role_requests: []
  # поля элемента: id, role (код роли), module (M01–M13 либо "не определено"),
  # text (что именно требуется подтвердить), blocks (какое продуктовое решение
  # блокируется до ответа), if_declined (что произойдёт при отрицательном ответе),
  # linked_statement (id связанного положения; отсутствует, если связи нет),
  # confirmation_status ("ожидает заключения роли" | "ответ роли зафиксирован"),
  # source (обязательно при confirmation_status "ответ роли зафиксирован")

# --- Массив term_candidates ---
# Кандидаты критичных терминов для глоссария; term_status двигается только candidate → approved → deprecated.

term_candidates: []
  # поля элемента: id, term, term_status (candidate | approved | deprecated), section

# --- Массив product_risks ---
# Риски, которые могут повлиять на ценность или границы продукта.

product_risks: []
  # поля элемента: id, text, section

# --- Массив out_of_scope ---
# Решения об исключении из текущей версии продукта, с обоснованием в тексте.

out_of_scope: []
  # поля элемента: id, text

# --- Массив process_references ---
# Ссылки на процессную опору (Конституция СИГМА.MES+ и её редакция); все такие ссылки — только здесь.

process_references: []
  # поля элемента: id, document (например, "Конституция СИГМА.MES+"),
  # revision (например, "v0.6"), note (например, "черновик, не утверждена")
