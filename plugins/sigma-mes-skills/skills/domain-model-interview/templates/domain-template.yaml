# domain.yaml — машинная проекция предметной модели.
# Шаблон: заполняются только те поля, значения которых названы. Пустое поле
# честнее правдоподобной подстановки. Ключи — латиницей; значения трёх осей —
# на русском языке, дословно как в перечнях references/statuses.md.
# Полное описание схемы — references/domain-schema.md.

product_id: "<идентификатор продукта — тот же, что в description.yaml>"
domain_version: "<номер версии предметной модели, например 0.1>"
document_status: "черновик"          # черновик | незавершённый черновик
date: "<ГГГГ-ММ-ДД>"
constitution_revision: "v0.8"
based_on_description_version: "<версия description.yaml, по которой построена модель>"
  # Обязательно. Модель без указания версии входа непроверяема.

objects: []
  # - id: OBJ-001                    # устойчивый идентификатор; сохраняется между версиями
  #   name: "<наименование объекта>"
  #   definition: "<что им считается и что не считается>"
  #   states:                        # пустым не бывает: объект без состояний либо не
  #     - "<имя состояния>"          # критичен, либо его жизненный цикл ещё не разобран
  #   state_basis: "<по каким установленным фактам и правилам объект признаётся в каждом
  #     состоянии; здесь различаются намерение, команда, состояние, наблюдение и
  #     производственный факт — см. references/terms-registry.md>"
  #   semantic_owner: ROLE-FUNCTIONAL-OWNER   # владелец смысла, со слов пользователя
  #   authoritative_state_source: "не определено"
  #     # «не определено» либо названное пользователем. Ведётся совместно с ROLE-ARCHITECT,
  #     # поэтому статус этого положения ВСЕГДА «ожидает заключения роли» либо
  #     # «ответ роли зафиксирован» — «утверждено ответственной ролью» ему недоступно.
  #   type: "продуктовый выбор"      # ось 1, значения из references/statuses.md
  #   confirmation_status: "ожидает заключения роли"   # ось 2
  #   approved_by: ROLE-FUNCTIONAL-OWNER
  #     # ТОЛЬКО при confirmation_status "утверждено ответственной ролью";
  #     # при любом другом статусе поле отсутствует целиком
  #   awaiting:                      # ось 3, ТОЛЬКО при статусах ролевой очереди
  #     role: ROLE-ARCHITECT
  #     module: M09                  # M01–M13 | "не определено" | "вне схемы M01–M13"
  #   formulated_by: "пользователь"  # пользователь | ИИ
  #   related: []                    # пустой список, если связей нет
  #   terms: []                      # идентификаторы записей terms, критичных для смысла
  #   part: objects

domain_rules: []
  # - id: DR-001
  #   text: "<условие над объектами, сохраняющее смысл при смене технологии>"
  #   objects: [OBJ-001]             # пустым не бывает: правило без объекта не проверяемо
  #   type: "продуктовое ограничение"
  #   confirmation_status: "зафиксировано как предложение"
  #   formulated_by: "пользователь"
  #   related: []
  #   terms: []
  #   part: rules

scenario:
  # Один сквозной производственный сценарий. Второй — отдельная модель, а не
  # второй элемент: см. references/domain-schema.md.
  # id: E2E-001
  # name: "<наименование сценария>"
  # maturity: "последовательность и границы"   # на Инициации значение единственное
  # steps:
  #   - actor: "<кто выполняет: роль процесса, производственная роль или внешняя система>"
  #     action: "<что происходит на шаге>"
  #     objects: [OBJ-001]
  #     boundary: "<внешняя система или область>"   # поле отсутствует, если шаг границы не пересекает
  # type: "продуктовый выбор"
  # confirmation_status: "зафиксировано как предложение"
  # formulated_by: "ИИ"
  # related: []
  # terms: []
  # part: scenario

terms: []
  # Словарь функциональной области. Состав записи — контракт из
  # references/terms-registry.md, раздел «Запись термина», полностью.
  # - id: TC-001
  #   term: "<предпочтительное русское наименование>"
  #   technical_id: TERM-STATE       # отсутствует, пока термин не сопоставлен с реестром
  #   definition: "<определение; здесь, в отличие от описания, заполняется>"
  #   synonyms: []                   # зарегистрированные alias
  #   scope: M09                     # M01–M13 | "межмодульный" | "уровень Конституции"
  #   owner_role: ROLE-FUNCTIONAL-OWNER
  #   source: "со слов пользователя"
  #   term_status: candidate         # candidate | approved | deprecated
  #     # approved — только по явному «утверждаю термин <id>», по одному термину,
  #     # при заполненных definition, scope и owner_role и при авторе определения
  #     # «пользователь». Межмодульному термину и термину уровня Конституции этот
  #     # навык approved не ставит никогда.
  #   check_result: TERM_PASS   # см. references/terms-registry.md
  #   formulated_by: "пользователь"
  #   part: terms

open_questions: []
  # - id: OQ-001
  #   text: "<вопрос, ответа на который пока нет>"
  #   addressed_to: ROLE-PROCESS-OWNER   # код роли, которая может закрыть вопрос;
  #     # обязательно: вопрос без адресата закрыть некому
  #   formulated_by: "ИИ"
  #   part: objects                  # у процессных вопросов поле отсутствует
  #   related: []
  #   status: "открыт"               # открыт | закрыт
  #   resolved_by: []

role_requests: []
  # - id: RR-001
  #   role: ROLE-ARCHITECT
  #   module: M09
  #   text: "<что именно требуется подтвердить>"
  #   blocks: "<какое предметное решение стоит до ответа>"
  #   if_declined: "<что произойдёт при отрицательном ответе>"
  #   linked_statement: OBJ-001      # отсутствует, если связи нет
  #   confirmation_status: "ожидает заключения роли"
  #   source: "<обязательно при статусе «ответ роли зафиксирован»>"
  # Инвариант: у каждого положения со статусом ролевой очереди есть ровно одна
  # такая запись с linked_statement на него. Процессные вопросы сюда не пишутся —
  # их место open_questions.

attachments: []
  # - id: AT-001
  #   link: "<ссылка на внутреннее хранилище; содержимое файла не копируется>"
  #   kind: "образец данных"         # макет | образец данных | внешняя система | норматив | иное
  #   extracted: []                  # идентификаторы элементов модели, извлечённых из материала
  #   confirmation_status: "зафиксировано как предложение"
  #   agreement:
  #     role: ROLE-FUNCTIONAL-OWNER
  #     module: M09

findings_state: []
  # Состояние работы по находкам приложенного заключения к гейту; появляется только
  # в режиме изменения. Правила — references/incoming-documents.md.
  # - finding_id: F-005
  #   state: "закрыта изменением"      # закрыта изменением | закрыта отказом |
  #     # не закрыта | не закрыта, роль не назначена
  #   resolved_by: [TC-103, TC-104]    # чем закрыта; у незакрытой — пустой список
  #   note: "<обязательна при отказе>"

process_references: []
  # - id: PR-001
  #   document: "Конституция СИГМА.MES+"
  #   revision: "v0.8"
  #   note: "draft_template, нормативные поля не заполнены"
