# screens.yaml — концепт интерфейса.
# Концепт отвечает на вопрос «что где стоит и что с этим можно сделать», а не
# «как это выглядит». Он НЕ заводит объектов: всё показанное уже есть в domain.yaml,
# а то, чего там нет, идёт в unbound.
# Полное описание схемы — references/screens-schema.md.
# Путь: docs/product/<product-id>/screens.yaml

product_id: "<идентификатор продукта — тот же, что в description.yaml и domain.yaml>"
screens_version: "<номер версии концепта, например 0.1>"
document_status: "черновик"          # черновик | незавершённый черновик
date: "<ГГГГ-ММ-ДД>"
based_on_domain_version: "<версия domain.yaml, по которой построен концепт>"
# based_on_research_version: "<версия research.yaml>"
  # ОТСУТСТВУЕТ целиком, если исследования не было.

layout: []
  # - id: LY-001
  #   name: "<наименование компоновки>"
  #   zones:
  #     - id: ZN-001
  #       name: "<наименование зоны>"
  #       placement: "слева"           # слева | справа | сверху | снизу | центр
  #         # словами, не координатами и не процентами
  #       orientation: "вертикально"   # вертикально | горизонтально | поля нет
  #       persistent: true             # видна при работе в других частях экрана;
  #         # у вложенной зоны поле НЕ указывается — наследуется от родительской.
  #         # Каждая persistent-зона покрывается запросом архитектору
  #       contains: []                 # id вложенных зон
  #       pattern: PT-001              # паттерн из research.yaml; отсутствует,
  #         # если решение своё или исследования не было

screens: []
  # - id: SC-001
  #   name: "<наименование экрана>"
  #   purpose: "<зачем экран нужен — на языке предметной области>"
  #   layout: LY-001
  #   scenario_steps: ["E2E-001#3"]    # шаги сквозного сценария через этот экран
  #     # экран без шагов — повод спросить, зачем он
  #   zone_content:
  #     - zone: ZN-001
  #       objects:
  #         - object: OBJ-001          # ТОЛЬКО существующий в domain.yaml
  #           states_visible: ["<состояние из списка states этого объекта>"]
  #           actions:
  #             - id: AC-001         # обязателен у действия с to_screen: запрос
  #               # архитектору о переходе ссылается на него, а не пересказывает
  #               name: "<что делает пользователь — глаголом предметной области>"
  #               to_state: "<состояние из списка того же объекта>"   # или поля нет
  #               to_screen: SC-002    # или поля нет
  #     - zone: ZN-004
  #       objects: []                  # пустой список допустим сам по себе.
  #         # Пометку «(нет объекта)» в каркасе зона получает не поэтому, а когда
  #         # пробел УСТАНОВЛЕН: объекта для неё в модели нет (и заведён открытый
  #         # вопрос) либо objects пуст у неё на всех экранах. Зона, до которой
  #         # просто не дошла очередь, пометки не несёт — см. domain-output-format.md
  #   type: "продуктовый выбор"
  #   confirmation_status: "зафиксировано как предложение"
  #   formulated_by: "пользователь"

unbound: []
  # Всё, за чем нет объекта модели, и всё, что относится к уровню исполнения:
  # размеры, цвета, поведение элементов управления, визуальный язык.
  # - id: UB-001
  #   zone: ZN-001
  #   text: "<что именно просили, как сказано>"
  #   resolution: RR-301               # НЕПУСТО: открытый вопрос либо запрос роли

open_questions: []
role_requests: []
  # Один запрос ROLE-PRODUCT-OWNER о соответствии концепта замыслу;
  # запросы ROLE-ARCHITECT по постоянным зонам и по переходам между экранами.
attachments: []
process_references: []
