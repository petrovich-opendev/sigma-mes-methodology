# research.yaml — обзор практик по функциональному дизайну.
# Исследование отвечает на вопрос «как это делают другие и что из этого подходит нам».
# Оно не создаёт предметных объектов и не меняет модель: его результат — вопросы,
# кандидаты с происхождением и записанный выбор владельца.
# Полное описание схемы — references/research-schema.md.
# Путь: docs/product/<product-id>/research.yaml

product_id: "<идентификатор продукта — тот же, что в description.yaml и domain.yaml>"
research_version: "<номер версии обзора, например 0.1>"
document_status: "черновик"          # черновик | незавершённый черновик
date: "<ГГГГ-ММ-ДД>"
based_on_domain_version: "<версия domain.yaml, к которой привязаны вопросы>"
  # Обязательно: вопрос привязан к объектам и шагам модели.

questions: []
  # - id: RQ-001
  #   text: "<вопрос исследования>"
  #   anchored_to: [OBJ-001, "E2E-001#4", ZN-001]
  #     # ОБЯЗАТЕЛЕН И НЕПУСТ: объект, шаг сценария (E2E-NNN#N) либо зона концепта.
  #     # Вопрос без привязки не принимается — его место parked.
  #   status: "открыт"                 # открыт | решён

patterns: []
  # По каждому вопросу — ДВА-ЧЕТЫРЕ кандидата, никогда один:
  # единственный кандидат — это не выбор, а подсказка ответа.
  # - id: PT-001
  #   name: "<краткое имя паттерна>"
  #   answers: RQ-001
  #   seen_in: ["<система или класс систем>"]
  #   description: "<поведение и организация: что показано, что можно сделать,
  #     куда ведёт. НЕ чужой экран: без цветов, сеток, размеров и фирменных
  #     названий элементов как образца>"
  #   provenance: "знание навыка"
  #     # материал пользователя | публичный источник | знание навыка | гипотеза
  #   source: "<ссылка или id записи attachments>"
  #     # ЕСТЬ тогда и только тогда, когда происхождение — материал пользователя
  #     # либо публичный источник; при «знание навыка» и «гипотеза» поля НЕТ
  #   verification: "не подтверждено"  # подтверждено | не подтверждено | опровергнуто
  #     # «знание навыка» и «гипотеза» НЕ МОГУТ быть «подтверждено»
  #   applies_to: [OBJ-001]
  #   gives: ["<что даёт>"]
  #   costs: ["<чего стоит>"]
  #   difference: "<чем наш случай отличается от того, где паттерн наблюдался>"
  #   type: "иллюстрация замысла"
  #   confirmation_status: "зафиксировано как предложение"
  #   formulated_by: "ИИ"
  # Отклонённый кандидат НЕ удаляется: его отклонение видно из decisions.

decisions: []
  # - id: RD-001
  #   question: RQ-001
  #   chosen: PT-001                   # либо "своё решение"
  #   rationale: "<почему выбрано именно это — словами владельца. Если основание
  #     только неподтверждённый кандидат, добавляется фраза
  #     «основание не подтверждено по источнику»>"
  #   went_to: ZN-001                  # куда решение ушло: зона, экран, объект, правило
  #   type: "продуктовый выбор"
  #   confirmation_status: "зафиксировано как предложение"
  #     # если rationale написан ИИ — «принято к формулировке» до переписывания
  #   formulated_by: "пользователь"

parked: []
  # - id: PK-001
  #   text: "<идея как сказана>"
  #   why_not_now: "<противоречит утверждённому положению с его id | нет привязки |
  #     выходит за границы версии>"

open_questions: []
  # состав полей — как в references/description-schema.md; addressed_to обязательно

role_requests: []
attachments: []
process_references: []
