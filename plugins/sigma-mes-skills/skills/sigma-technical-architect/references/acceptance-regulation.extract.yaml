sections:
- heading: 0. Паспорт документа
  text: |-
    **document_id: **REG-FUNCTIONAL-ACCEPTANCE

    **version: **0.1

    **status: **draft — черновик

    **document_owner_role_id: **ROLE-FUNCTIONAL-ARCHITECT

    **publisher_role_id: **ROLE-DOCUMENTATION-OWNER

    **basis: **CONST-SIGMA-MES 0.9 — RULE-ACCEPTANCE-001–007, RULE-FA-CHANGE-001–002, RULE-SCENARIO-001, раздел 3.1, приложение A.3

    **source: **документ «Принципы приёмки функциональным архитектором»; отличия от него — раздел 6

    **precedence: **при расхождении с Конституцией действует Конституция
- heading: 0.1. Структура и разметка
  text: |-
    Каждый элемент начинается с заголовка с идентификатором: уровень объекта приёмки — ACC-LEVEL-…, принцип — ACC-PRINCIPLE-…, шаг приёмки — ACC-STEP-…, исход — код приложения A.3 Конституции. Поля начинаются с подписи, выделенной полужирным шрифтом. Поле «Пример» иллюстрирует принцип и нормой не является: состав состояний, ролей пользователей и правил конкретного объекта задаёт функциональная архитектура его модуля. Поле «Правило Конституции» указывает правило, которое реализует элемент.
- heading: 1. Основной принцип функциональной приёмки
  text: |-
    Функциональный архитектор принимает реализованную функциональность не как тестировщик и не как представитель разработки, а как владелец функциональной целостности решения: он проверяет, что реализованная функциональность соответствует согласованной функциональной архитектуре и требованиям, правильно встроена в производственный процесс и не нарушает существующую функциональную модель MES.

    Таким образом, функциональный архитектор принимает не программный код и не экран интерфейса, а реализованную функциональность как часть целостной функциональной архитектуры MES.

    **Основной вопрос функционального архитектора: **«Получили ли мы именно ту функциональную способность MES, которая была предусмотрена функциональной архитектурой, и корректно ли она встроена в остальные функциональные возможности системы?»

    А не «Работает ли эта кнопка?». Проверка «кнопка работает» — задача тестирования.

    Проверка «Правильно ли вообще определено, что должна делать эта кнопка, в каком процессе, для какой роли пользователя, над каким объектом, в каких состояниях и с какими последствиями?» — уже зона ответственности функционального архитектора.

    **Правило Конституции: **RULE-ACCEPTANCE-001, RULE-ACCEPTANCE-005.
- heading: 2. Объект приёмки
  text: |-
    Объект приёмки делится на шесть уровней.
- heading: 4. Порядок функциональной приёмки
  text: |-
    Шаги выполняются после PASS тестовых сценариев (RULE-ACCEPTANCE-004).
- heading: 5. Главный критерий работы функционального архитектора
  text: |-
    Функциональный архитектор должен убедиться, что реализованная функциональность является корректной реализацией функциональной архитектуры, а не просто работающей программной функцией.

    **Практический критерий: **«Если переданная разработкой функциональность будет включена в промышленную эксплуатацию, будет ли она вести себя так, как предусмотрено функциональной архитектурой MES, во всех существенных производственных сценариях и во взаимодействии с остальной системой?»

    Если ответ «да» — функциональная приёмка пройдена.

    Итого, должен соблюдаться очень важный принцип: функциональный архитектор не только принимает реализацию относительно функциональной архитектуры — он одновременно проверяет обратную связь от реализации в функциональную архитектуру.

    Если в ходе разработки выяснилось, что первоначальная функциональная модель была неполной или ошибочной, функциональный архитектор должен не просто поставить разработке задачу «сделать так», а определить, нужно ли изменить саму функциональную архитектуру, согласовать изменение и обеспечить актуальность документации функциональной архитектуры.

    Именно это превращает роль функционального архитектора из «принимающего тестировщика» во владельца функциональной целостности MES.

    **Правило Конституции: **RULE-FA-CHANGE-001; новую редакцию функциональной архитектуры публикует ROLE-DOCUMENTATION-OWNER (RULE-AI-002).
- heading: 6. Отличия от исходного документа
  text: |-
    Содержание исходного документа перенесено полностью: шесть уровней, десять принципов со всеми перечнями и примерами, десять шагов, четыре исхода, главный критерий и принцип обратной связи. Ниже — все отличия.

    - 1. Заголовок «Основной принцип архитектурной приёмки» заменён на «Основной принцип функциональной приёмки» — термин TERM-FUNCTIONAL-ACCEPTANCE Конституции.

    - 2. Слово «архитектура» без уточнения заменено на «функциональная архитектура»: «предусмотрена архитектурой», «относительно архитектуры» (принципы 1 и 10, главный критерий), «архитектурное решение» (принцип 2), «архитектурной документации». В Конституции две архитектуры, и по RULE-TERM-002 слово без уточнения неоднозначно.

    - 3. «Архитектор» в значении функционального заменён на «функциональный архитектор»: в проекте есть и ROLE-TECHNICAL-ARCHITECT.

    - 4. «Я бы разделил объект приёмки на 6 уровней» заменено на «Объект приёмки делится на шесть уровней»: регламент устанавливает порядок, а не мнение.

    - 5. Таблица уровней и таблица ролей пользователей заменены записями с идентификаторами и перечнями — единая разметка без таблиц; содержание не изменено.

    - 6. В принципе 1 восстановлен пропущенный глагол («принимает реализацию относительно цепочки»), в цепочке «функциональная функция» заменена на «функция».

    - 7. «Роль» в принципе 5, на шагах 5 и 9 уточнена как «роль пользователя»: в Конституции «роль» — проектная роль (TERM-ROLE).

    - 8. «Этап 1–10» заменены на «шаг» (ACC-STEP-01–10): в Конституции «этап» — этап SDLC (TERM-SDLC-STAGE).

    - 9. На шаге 1 «архитектурное решение (описание реализованных функций, изменённые бизнес-объекты, сценарии и т. д.)» заменено на «описание реализованного от ROLE-DEVELOPER» с отличиями от функциональной архитектуры, добавлены результаты тестовых сценариев со статусом PASS: в Конституции «архитектурное решение» — решение технической архитектуры, а передачу на приёмку задаёт RULE-ACCEPTANCE-004.

    - 10. На шаге 10 «Возможны 4 состояния» заменено на четыре исхода с кодами приложения A.3, описания приведены к тексту A.3; «утверждённой функциональной архитектуре» заменено на «действующей»: определение исхода одно — в Конституции, а отдельного утверждения функциональной архитектуры Конституция не предусматривает.

    - 11. На шаге 10 добавлены регистрация замечаний как элементов работ, выбор после исхода «Отклонено архитектурно» по RULE-FA-CHANGE-002 и состав записи результата.

    - 12. В принципе 10 «уже была утверждена» заменено на «уже принята» по той же причине, что в пункте 10; добавлена запись ответов на девять вопросов в запись об изменении функциональной архитектуры.

    - 13. В принципе 7 к названиям модулей добавлены коды M11 и M13 по разделу 1.3.1 Конституции.

    - 14. Добавлены паспорт, поля «Пример» и «Правило Конституции» и строка о выполнении шагов после PASS тестовых сценариев: примеры иллюстрируют принцип, а норму для объекта задаёт функциональная архитектура его модуля.
levels:
- id: ACC-LEVEL-1
  title: Требование
  text: |-
    **Что проверяет функциональный архитектор: **Реализовано ли требуемое функциональное поведение.
- id: ACC-LEVEL-2
  title: Функция
  text: |-
    **Что проверяет функциональный архитектор: **Реализована ли функциональная возможность в полном объёме.
- id: ACC-LEVEL-3
  title: Бизнес-процесс
  text: |-
    **Что проверяет функциональный архитектор: **Правильно ли функция встроена в процесс.
- id: ACC-LEVEL-4
  title: Бизнес-объекты
  text: |-
    **Что проверяет функциональный архитектор: **Правильно ли реализованы и используются бизнес-объекты, их состояния и связи.
- id: ACC-LEVEL-5
  title: Взаимодействия
  text: |-
    **Что проверяет функциональный архитектор: **Корректно ли функция взаимодействует с другими модулями и функциями MES.
- id: ACC-LEVEL-6
  title: Архитектурная целостность
  text: |-
    **Что проверяет функциональный архитектор: **Не нарушает ли реализация общую функциональную архитектуру.

    Именно шестой уровень отличает функционального архитектора от обычного функционального тестировщика.
principles:
- id: ACC-PRINCIPLE-01
  title: Приёмка относительно зафиксированной функциональной архитектуры
  text: |-
    Функциональный архитектор принимает реализацию относительно цепочки:

    Функциональное требование → функция → бизнес-процесс → бизнес-объекты → правила и алгоритмы → сценарии → критерии приёмки.

    Если этой цепочки нет, приёмка превращается в субъективную оценку.

    **Правило Конституции: **RULE-ACCEPTANCE-002.
  constitution_rules:
  - RULE-ACCEPTANCE-002
- id: ACC-PRINCIPLE-02
  title: Проверять не только основной сценарий
  text: |-
    Одна из наиболее распространённых ошибок при приёмке функциональности: разработчик демонстрирует успешный сценарий, и функциональный архитектор видит, что всё работает. Этого недостаточно.

    Система должна корректно работать также на граничных и исключительных состояниях.

    **Пример: **для функции назначения производственного задания необходимо проверить:

    - Нормальный сценарий: есть задание → есть доступный рабочий центр → назначение разрешено.

    - Альтернативный сценарий: рабочий центр занят → система предлагает другой допустимый ресурс.

    - Ошибочный сценарий: рабочий центр недоступен → назначение запрещено.

    - Пограничный сценарий: рабочий центр становится недоступным непосредственно после открытия формы.

    - Конкурентный сценарий: два диспетчера одновременно пытаются назначить одно задание.

    - Производственный сценарий: задание уже частично выполнено.

    - Сценарий изменения данных: технологический маршрут был изменён после создания производственного задания.

    Именно такие случаи показывают, действительно ли реализовано решение функциональной архитектуры.

    **Правило Конституции: **RULE-ACCEPTANCE-003.
  constitution_rules:
  - RULE-ACCEPTANCE-003
- id: ACC-PRINCIPLE-03
  title: Проверять бизнес-смысл, а не только интерфейс
  text: |-
    Функциональный архитектор не должен ограничиваться UI.

    **Пример: **разработка показывает: «Вот форма производственного задания. Здесь появились поля „Плановое количество“ и „Фактическое количество“». Функциональный архитектор должен получить ответы (проверить):

    - Откуда берётся плановое количество?

    - Можно ли его изменять и при каких условиях?

    - В каком состоянии заказа?

    - Что происходит при изменении?

    - Как рассчитывается фактическое количество?

    - Изменяется ли оно автоматически в предусмотренных случаях?

    - Что происходит с незавершённым количеством?

    - Как это влияет на производственный заказ?

    - Как это отражается в планировании?

    - Как это отображается в аналитике?

    - Что происходит при отмене операции?

    То есть UI — это только представление функциональности, а не сама функциональность.

    **Правило Конституции: **RULE-ACCEPTANCE-001.
  constitution_rules:
  - RULE-ACCEPTANCE-001
- id: ACC-PRINCIPLE-04
  title: Проверять состояния бизнес-объектов
  text: |-
    Практически каждый важный бизнес-объект имеет жизненный цикл.

    **Пример: **согласно функциональной архитектуре бизнес-объект «Производственный заказ» имеет набор состояний и допустимые переходы между ними: Создан → Запланирован → Подготовлен → Выполняется → Приостановлен → Возобновлён → Завершён.

    При приёмке функциональный архитектор должен проверить:

    - какие состояния предусмотрены функциональной архитектурой;

    - какие переходы между состояниями существуют;

    - кто может инициировать переход;

    - какие условия необходимы;

    - какие действия происходят при переходе;

    - какие события формируются;

    - какие функции становятся доступными или недоступными.

    **Пример: **может ли оператор начать операцию, если производственный заказ находится в состоянии «Приостановлен»?

    **Правило Конституции: **RULE-ACCEPTANCE-003; модель, состояния и жизненный цикл объекта определяет функциональный архитектор его основного модуля (RULE-SCOPE-001).
  constitution_rules:
  - RULE-ACCEPTANCE-003
  - RULE-SCOPE-001
- id: ACC-PRINCIPLE-05
  title: Проверять роли пользователей и ответственность
  text: |-
    Функция должна проверяться в контексте роли пользователя.

    **Пример: **роли пользователей и их возможности:

    - Рабочий — выполнить операцию;

    - Мастер — назначить или перераспределить;

    - Диспетчер — управлять очерёдностью;

    - Технолог — изменять технологические параметры;

    - Контролёр качества — зафиксировать результат контроля;

    - Начальник цеха — просматривать состояние производства.

    При приёмке необходимо проверить:

    - кто видит функцию;

    - кто может выполнять действие;

    - кто может отменить действие;

    - кто может изменить результат;

    - кто может подтвердить;

    - кто может выполнить операцию в обход стандартного сценария.

    Особенно важно проверить не только «может ли пользователь сделать», но и «не должен ли этот пользователь иметь возможность это сделать?».

    **Правило Конституции: **RULE-ACCEPTANCE-003.
  constitution_rules:
  - RULE-ACCEPTANCE-003
- id: ACC-PRINCIPLE-06
  title: Проверять правила, а не только результат
  text: |-
    Большое количество функциональности реализуется через бизнес-правила. Например: нельзя начать операцию, пока не выполнены условия подготовки. Нужно проверить не только запрет, но и все условия, из которых состоит правило.

    **Пример: **можно начать операцию, если: Заказ = RELEASED AND Предыдущая операция = COMPLETED AND Материал = AVAILABLE AND Рабочий центр = AVAILABLE AND Оператор имеет квалификацию AND Оснастка = AVAILABLE. Если разработка реализовала только «Заказ = RELEASED», интерфейс может прекрасно работать, тесты могут пройти, но функциональность не соответствует требованию (функциональной архитектуре).

    **Правило Конституции: **RULE-ACCEPTANCE-003.
  constitution_rules:
  - RULE-ACCEPTANCE-003
- id: ACC-PRINCIPLE-07
  title: Проверять интеграцию функции с другими функциями
  text: |-
    Функциональный архитектор должен обязательно смотреть за пределы модуля, в котором принимается функциональность.

    **Пример: **реализуется функция «Регистрация завершения производственной операции». Нельзя проверить только: нажали «Завершить» → появилось «Завершено». Нужно проверить последствия: Завершение операции → Производственная операция = COMPLETED → Обновление производственного заказа → Обновление НЗП → Формирование следующей операции → Обновление доступности ресурса → Расчёт фактического времени → Передача информации в Управление качеством (M11) → Передача информации в Производственную аналитику (M13).

    Функциональный архитектор должен проверить функциональную цепочку.

    **Правило Конституции: **RULE-ACCEPTANCE-003.
  constitution_rules:
  - RULE-ACCEPTANCE-003
- id: ACC-PRINCIPLE-08
  title: Проверять информационную целостность
  text: |-
    Функция должна корректно работать с бизнес-объектами и данными.

    **Пример: **если оператор регистрирует выпуск изделия, необходимо проверить:

    - какое изделие зарегистрировано;

    - какая партия;

    - какой серийный номер;

    - какая операция;

    - какой заказ;

    - какой рабочий центр;

    - какой исполнитель;

    - какое время;

    - какая версия технологии;

    - какие материалы использованы.

    **Правило Конституции: **RULE-ACCEPTANCE-003, RULE-FACT-001.
  constitution_rules:
  - RULE-ACCEPTANCE-003
  - RULE-FACT-001
- id: ACC-PRINCIPLE-09
  title: Проверять сквозной сценарий
  text: |-
    Очень полезно разделять локальную приёмку — например, проверяется одна функция «Создать производственное задание» — и сквозную приёмку — например, проверяется производственный сценарий:

    Производственный заказ → планирование → задание → комплектование → выдача задания → выполнение операции → контроль качества → завершение → передача результата дальше.

    Функциональный архитектор должен обязательно участвовать во втором типе проверки. Именно сквозные сценарии показывают, соответствует ли реализованная функциональность общей функциональной архитектуре.

    **Правило Конституции: **RULE-SCENARIO-001; заключение ROLE-FUNCTIONAL-ARCHITECT к GATE-03 по сквозной приёмке (раздел 3.2 Конституции).
  constitution_rules:
  - RULE-SCENARIO-001
- id: ACC-PRINCIPLE-10
  title: Проверять изменения относительно функциональной архитектуры
  text: |-
    Очень часто во время разработки возникает: «Мы немного изменили первоначальное решение». Это не обязательно плохо, но функциональный архитектор должен выяснить:

    - 1. Что изменилось?

    - 2. Почему?

    - 3. Кто согласовал?

    - 4. Какие требования затронуты?

    - 5. Какие другие функции затронуты?

    - 6. Не возникли ли новые ограничения?

    - 7. Не нарушена ли общая модель объектов?

    - 8. Не появились ли дублирующие функции?

    - 9. Нужно ли изменить функциональную архитектуру?

    Очень важно: функциональная архитектура не должна оставаться неизменной только потому, что она уже принята. Если реализация выявила более правильное решение, функциональная архитектура может быть изменена — но осознанно и управляемо.

    Ответы на девять вопросов записываются в запись об изменении функциональной архитектуры.

    **Правило Конституции: **RULE-FA-CHANGE-001, RULE-FA-CHANGE-002.
  constitution_rules:
  - RULE-FA-CHANGE-001
  - RULE-FA-CHANGE-002
steps:
- id: ACC-STEP-01
  title: Подготовка
  text: |-
    До демонстрации функциональный архитектор получает:

    - исходные функциональные требования;

    - описание реализованного от ROLE-DEVELOPER — реализованные функции, изменённые бизнес-объекты, сценарии и все отличия от функциональной архитектуры (RULE-ACCEPTANCE-004);

    - результаты тестовых сценариев со статусом PASS.
- id: ACC-STEP-02
  title: Анализ реализованной функциональности
  text: |-
    Функциональный архитектор сопоставляет: функциональное требование ↔ функциональная архитектура ↔ реализация.

    И определяет:

    - что должно быть реализовано;

    - что действительно реализовано;

    - что реализовано иначе;

    - что не реализовано;

    - что появилось дополнительно.

    **Правило Конституции: **функциональность, появившаяся без функционального требования, не принимается (RULE-ACCEPTANCE-002); отличие от функциональной архитектуры принимается только как её изменение (RULE-FA-CHANGE-001).
  constitution_rules:
  - RULE-ACCEPTANCE-002
  - RULE-FA-CHANGE-001
- id: ACC-STEP-03
  title: Проверка основного сценария
  text: |-
    Выполняется стандартный бизнес-сценарий.

    **Пример: **создание производственного задания → назначение → выполнение → завершение.
- id: ACC-STEP-04
  title: Проверка альтернативных сценариев
  text: |-
    Проверяются:

    - отсутствие необходимых данных;

    - неправильное состояние объекта;

    - недоступность ресурса;

    - отмена операции;

    - повторное выполнение;

    - частичное выполнение;

    - изменение исходных данных.
- id: ACC-STEP-05
  title: Проверка ролей пользователей
  text: |-
    Функция проверяется от имени всех значимых ролей пользователей.
- id: ACC-STEP-06
  title: Проверка состояний
  text: |-
    Проверяются:

    - состояния объектов;

    - допустимые переходы;

    - недопустимые переходы;

    - автоматические переходы;

    - ручные переходы.
- id: ACC-STEP-07
  title: Проверка взаимодействий
  text: |-
    Проверяется влияние на соседние функциональные области и бизнес-объекты, например:

    - производственные заказы;

    - ресурсы;

    - качество;

    - логистику;

    - MDC;

    - планирование;

    - аналитику.
- id: ACC-STEP-08
  title: Проверка данных и результатов
  text: |-
    Проверяются:

    - корректность данных;

    - полнота;

    - непротиворечивость;

    - история;

    - трассируемость;

    - корректность расчётов.
- id: ACC-STEP-09
  title: Проверка архитектурной целостности
  text: |-
    **Главный вопрос: **не создала ли новая функциональность архитектурный долг?

    Например, новая функциональность:

    - дублирует существующую функцию;

    - вводит новый объект вместо существующего;

    - нарушает единый жизненный цикл объекта;

    - создаёт исключительный механизм;

    - нарушает единые правила ролей пользователей;

    - вводит собственные правила, противоречащие общим;

    - создаёт отдельный способ выполнения того же процесса.

    **Правило Конституции: **RULE-ACCEPTANCE-003; основной модуль объекта — RULE-SCOPE-001; общие элементы функциональной архитектуры — RULE-SCOPE-003.
  constitution_rules:
  - RULE-ACCEPTANCE-003
  - RULE-SCOPE-001
  - RULE-SCOPE-003
- id: ACC-STEP-10
  title: Формирование решения о приёмке
  text: |-
    Результат приёмки фиксируется одним из четырёх исходов приложения A.3 Конституции:

    - ACCEPTED — «Принято»: функциональность полностью соответствует функциональным требованиям и функциональной архитектуре;

    - ACCEPTED_WITH_REMARKS — «Принято с замечаниями»: есть несущественные отклонения, не препятствующие использованию;

    - RETURNED — «На доработку»: есть функциональные несоответствия функциональным требованиям или функциональной архитектуре;

    - REJECTED_ARCHITECTURALLY — «Отклонено архитектурно»: функция технически работает, но реализация противоречит действующей функциональной архитектуре и требует пересмотра решения.

    Последний вариант особенно важен.

    Замечания исхода «Принято с замечаниями» регистрируются как элементы работ. После исхода «Отклонено архитектурно» функциональный архитектор решает, переделывается ли реализация под функциональную архитектуру или функциональная архитектура изменяется (RULE-FA-CHANGE-002).

    В записи результата указываются функциональность, функциональные требования, редакция функциональной архитектуры, исход и замечания.

    **Правило Конституции: **RULE-ACCEPTANCE-006, RULE-FA-CHANGE-002; влияние исходов на решение GO — раздел 3.1 Конституции.
  constitution_rules:
  - RULE-ACCEPTANCE-006
  - RULE-FA-CHANGE-002
