# Реестр утверждённых условий ролей (правило R14 протокола сеанса, решение Q-107).
#
# Роль может дополнять правила Конституции собственными условиями в пределах своих
# полномочий. Общее правило: разрешено всё, что явно не запрещено и не задекларировано
# Конституцией. При противоречии с Конституцией действует Конституция.
#
# Порядок: роль готовит запись в режиме «Предложить условие роли» своего навыка (роль без
# своего навыка — в режиме G-4 навыка гейтов) → ROLE-AI-USE-CASE-OWNER даёт GO → запись
# вносится сюда и выходит новой версией плагина. Без GO запись сюда не вносится.
#
# Поля записи:
#   id          RC-NNN, уникальный номер
#   role        код роли из Конституции, которая ставит условие
#   module      необязательно: модуль или функциональная область, если условие только для них
#   applies_to  режимы навыка роли (например FA-1, TA-3) и/или гейты (GATE-01 … GATE-06)
#   text        условие одной формулировкой
#   reason      зачем оно нужно
#   proposed    by: носитель или роль; date: ГГГГ-ММ-ДД
#   approval    role: ROLE-AI-USE-CASE-OWNER; decision: GO; statement: дословная цитата; date: ГГГГ-ММ-ДД
#
# Пример записи (не действует, показан для формата):
#   - id: RC-001
#     role: ROLE-FUNCTIONAL-ARCHITECT
#     module: M07
#     applies_to: [FA-1, GATE-02]
#     text: У каждого ключевого объекта модуля есть жизненный цикл с запрещёнными переходами.
#     reason: Ошибки переходов статусов — главный источник возвратов на приёмке.
#     proposed: {by: функциональный архитектор M07, date: 2026-10-01}
#     approval: {role: ROLE-AI-USE-CASE-OWNER, decision: GO, statement: "GO", date: 2026-10-01}

