- heading: 0.1. Структура и разметка
  text: |-
    Каждый элемент документа начинается с заголовка, в котором стоит его идентификатор: у раздела — номер, у этапа и гейта — STAGE-… / GATE-…, у правила — RULE-…, у роли — ROLE-…, у термина — TERM-…, у исхода функциональной приёмки — код в верхнем регистре. Поля записей начинаются с подписи, выделенной полужирным шрифтом. Таблицы не используются. Ссылка на элемент делается только по его идентификатору.
- heading: 1.1. Назначение Конституции
  text: |-
    Конституция устанавливает единые обязательные правила разработки, внедрения, эксплуатации, сопровождения и развития СИГМА.MES+. Она определяет границы продукта, полномочия участников и порядок принятия ключевых решений на этапах жизненного цикла. Все участники проекта и команды обязаны соблюдать применимые к ним правила Конституции, сохраняя самостоятельность в выборе способов работы и технических решений. Обязательные требования применимого законодательства и заключённых договоров имеют приоритет перед внутренними правилами Конституции.
- heading: 1.2. Назначение СИГМА.MES+
  text: |-
    СИГМА.MES+ предназначена для управления выполнением производственных заказов на предприятиях корпорации — от подготовки производственных данных и планирования до диспетчеризации, оперативного управления выполнением операций, контроля качества и фиксации фактических результатов. Платформа обеспечивает прослеживаемость выполнения производственных заказов и предоставляет фактические производственные данные для оперативного управления и аналитики. Особенности предприятий поддерживаются настройками, а обмен с ERP, CAD/PDM и оборудованием осуществляется через интеграции без подмены функций этих систем.
- heading: 1.3.1. Состав продукта
  text: |-
    СИГМА.MES+ является единым настраиваемым продуктом. Он состоит из параметрического ядра с поддержкой плагинов (TERM-PARAMETRIC-CORE), функциональных модулей M01–M13, пользовательских приложений и средств интеграции и обеспечивает выполнение назначения, установленного разделом 1.2.

    **Функциональные модули:**

    - M01 — Общая НСИ;

    - M02 — Составы и технологии;

    - M03 — Производственная структура;

    - M04 — Управление ресурсами;

    - M05 — Управление документацией;

    - M06 — Управление проектами;

    - M07 — Управление заказами;

    - M08 — Планирование и расписания;

    - M09 — Производственная логистика;

    - M10 — Управление операциями;

    - M11 — Управление качеством;

    - M12 — Мониторинг оборудования;

    - M13 — Производственная аналитика.

    Объём функций каждого модуля определяет его функциональная архитектура; механизмы ядра и подключения плагинов определяет техническая архитектура (RULE-ARCH-002).
- heading: 1.3.2. Границы со смежными системами и оборудованием
  text: |-
    СИГМА.MES+ получает и ведёт производственные данные, необходимые для планирования и выполнения производства, включая используемые в производстве спецификации и составы изделий, технологические описания и их версии. При этом СИГМА.MES+ не заменяет CAD/PDM в части проектирования изделия и ведения исходной конструкторской документации, а также ERP в части финансового, бухгалтерского и корпоративного закупочного учёта. Управление техническим обслуживанием и ремонтами оборудования не входит в базовую границу продукта и требует отдельного решения.

    Производственная логистика и управление качеством входят в функциональную область СИГМА.MES+ в объёме, установленном их функциональной архитектурой. Если на предприятии используются внешние WMS, QMS или другие специализированные системы, границы их ответственности и порядок обмена данными определяются проектной документацией и интеграционными контрактами.

    СИГМА.MES+ получает данные о работе оборудования, связывает их с производственным контекстом и использует для диспетчеризации, контроля выполнения и регистрации производственных фактов. Непосредственное управление оборудованием и физическим технологическим процессом остаётся за ЧПУ, PLC, SCADA, DCS и другими средствами промышленной автоматизации.

    Интеграция с внешней системой сама по себе не передаёт СИГМА.MES+ её функции или право изменять принадлежащие ей данные. Для каждого ключевого объекта и его данных в функциональной архитектуре определяется модуль или внешняя система, в которой ведётся актуальное состояние (RULE-DATA-001).
- heading: 1.3.3. Изменение границ и состава модулей
  text: |-
    Расширение продукта за установленные границы оформляется как изменение Конституции. Изменение состава модулей M01–M13 определяет ROLE-PRODUCT-OWNER по RULE-PRODUCT-FRAME-002; оно оформляется как изменение Конституции по разделу 5.3.

    В пределах этих границ назначение, ценность и границы развиваемого продукта определяет ROLE-PRODUCT-OWNER по RULE-PRODUCT-FRAME-001.
- heading: 1.4. Граница самой Конституции
  text: |-
    Конституция содержит только устойчивые правила, действующие на уровне всего проекта либо распространяющиеся на несколько команд, модулей или этапов жизненного цикла СИГМА.MES+. Функциональные требования, функциональная и техническая архитектура, регламенты работы ролей, планы, доказательства и состав отдельных выпусков фиксируются в соответствующей проектной документации и не включаются в Конституцию. Конституция изменяется только при изменении назначения или границ продукта, полномочий участников, жизненного цикла либо общих обязательных правил.
- heading: 1.5. Соответствие OpenUP
  text: |-
    Конституция является адаптацией OpenUP 1.5.1.5 и не заявляет полного соответствия ему. Этапы STAGE-01–STAGE-04 соответствуют фазам OpenUP «Инициация», «Проработка», «Построение» и «Переход»; этапы STAGE-05 и STAGE-06 — локальное расширение жизненного цикла продукта после выпуска.

    **Роли OpenUP исполняют:**

    - Analyst — ROLE-FUNCTIONAL-ARCHITECT;

    - Architect — ROLE-TECHNICAL-ARCHITECT;

    - Developer — ROLE-DEVELOPER;

    - Tester — ROLE-TEST-ENGINEER;

    - Project Manager — ROLE-PROJECT-MANAGER;

    - Stakeholder — ROLE-PRODUCT-OWNER и другие заинтересованные стороны.

    **Отступления от OpenUP:**

    - продуктовую часть Vision ведёт ROLE-PRODUCT-OWNER, а не Analyst;

    - стратегия и достаточность проверки выделены из обязанностей Tester в роль ROLE-VERIFICATION-OWNER;

    - остальные роли раздела 4.2 являются локальным расширением.

    **Рабочие продукты OpenUP соответствуют:**

    - модель и описания вариантов использования — функциональной архитектуре и функциональным требованиям;

    - глоссарий — реестру терминов;

    - общесистемные требования — требованиям к качеству;

    - Architecture Notebook — технической архитектуре;

    - Iteration Plan, Risk List и Work Items List — планам ROLE-PROJECT-MANAGER.
- heading: 3.1. Общее правило гейта
  text: |-
    Решение по гейту принимает ответственная роль, указанная в разделе 3.2, на основании обязательных заключений и актуальных доказательств, достаточных с учётом значимости и риска оцениваемого результата. Решение фиксируется как GO, REWORK или STOP, а для GATE-05 также допускается RETIRE.

    Каждое изменение, включённое в оцениваемый результат, должно быть прослеживаемо от задачи и требования до проектных материалов, реализации, результатов проверки и решения по гейту.

    Если сведения ведутся в нескольких системах, для каждого вида сведений определяется основной источник, устанавливается соответствие статусов и обеспечивается управляемая передача информации об их изменении между системами. Расхождения в статусах должны быть устранены до принятия решения GO.

    Перечень используемых систем, состав и значение статусов, а также порядок обмена сведениями устанавливаются отдельным управляемым регламентом.

    Отсутствие обязательного заключения или доказательства, а также неустранённое противоречие или расхождение статусов исключает решение GO. Совещание, наличие документа, успешная автоматическая проверка, результат ИИ или отдельный статус в информационной системе сами по себе не означают прохождение гейта.

    На GATE-03 и GATE-04 решение GO исключается также, если функциональность в оцениваемом результате не прошла функциональную приёмку или получила исход «На доработку» или «Отклонено архитектурно»; исход «Принято с замечаниями» решению GO не препятствует.
- heading: 4.1. Правила применения ролевой модели
  text: |-
    Автор изменения продукта не утверждает единолично его предметный смысл, достаточность проверки, остаточный риск и выпуск. ИИ ролью не является.

    Носители ролей, закрепление модулей M01–M13 за функциональными архитекторами, общие элементы функциональной архитектуры по RULE-SCOPE-003 и замещения ведутся в Реестре назначений ролей, который ведёт ROLE-PROCESS-OWNER и публикует ROLE-DOCUMENTATION-OWNER; закрепление модулей и общих элементов определяет ROLE-PRODUCT-OWNER.

    ROLE-RELEASE-AUTHORITY не совмещается с ROLE-DELIVERY-LEAD.

    При совмещении ROLE-SECURITY-OWNER с функциями DevOps обязательна независимая оценка инфраструктурных доказательств специалистом, который не является их автором. Владельцем риска недостаточной независимости является ROLE-PROCESS-OWNER; совмещение пересматривается перед каждым GATE-03 и GATE-04 и при подготовке следующей редакции Конституции, в зависимости от того, что наступит раньше.

    Роль OpenUP Analyst исполняет ROLE-FUNCTIONAL-ARCHITECT (раздел 1.5). До назначения ROLE-TEST-ENGINEER функциональное и интеграционное тестирование выполняет ROLE-FUNCTIONAL-ARCHITECT; ROLE-DEVELOPER его вместо ROLE-TEST-ENGINEER не выполняет.
- heading: 5.1. Терминологическое правило
  text: |-
    Значимые термины, используемые при разработке, применении и сопровождении продукта, а также в связанной с ним документации, ведутся в реестре терминов. Реестр может включать общие и тематические разделы, но каждый термин должен иметь одно действующее определение.

    К значимым относятся термины, различное понимание которых может повлиять на требования, функциональность, архитектуру, данные, интерфейсы или порядок использования продукта.

    Для каждого термина указываются предпочтительное наименование, определение, область применения, статус, источник, стабильный технический идентификатор на английском языке и, при необходимости, допустимые синонимы.

    Добавление, изменение или исключение термина выполняется в установленном порядке и утверждается в соответствии с разделом 5.2. Для каждого изменения сохраняются автор, дата, основание, версия, статус и история изменений. Утверждённые термины используются единообразно в продукте и связанной с ним документации.
- heading: 5.2. Ответственность за термин
  text: |-
    За содержание и утверждение терминов отвечает роль, определённая разделом 4 по области, к которой относится понятие: предметные термины утверждает ROLE-FUNCTIONAL-ARCHITECT, термины технической архитектуры — ROLE-TECHNICAL-ARCHITECT, термины правил и процессов проекта — ROLE-PROCESS-OWNER.

    Значение межмодульного термина согласуют функциональные архитекторы затронутых модулей, при разногласии решает ROLE-PRODUCT-OWNER (RULE-SCOPE-002). Термин, затрагивающий области разных ролей, согласовывается этими ролями, а устранение разногласий организует ROLE-PROCESS-OWNER. До завершения согласования термин не получает статус approved.

    ROLE-DOCUMENTATION-OWNER организует ведение реестра терминов: регистрирует предложения, контролирует наличие обязательных сведений, статусы, версии и историю изменений, организует согласование и публикует утверждённые определения. На основании зафиксированного решения соответствующей роли ROLE-DOCUMENTATION-OWNER присваивает термину статус. ROLE-DOCUMENTATION-OWNER может вернуть термин на доработку, но не определяет и не утверждает его предметный или технический смысл.

    Любой участник проекта может предложить новый термин или изменение действующего определения. ИИ и автоматические средства могут подготовить предложение и проверить согласованность терминологии, но не могут утверждать термин или изменять его статус.
- heading: 5.3. Изменение Конституции
  text: |-
    Конституция изменяется, если требуется изменить назначение или границы продукта, правило, действующее на уровне всего проекта либо распространяющееся на несколько команд, модулей или этапов жизненного цикла продукта, состав этапов или гейтов, ответственность или полномочия ролей, а также общие правила управления терминологией.

    Изменение отдельной функции продукта, технического решения, документа, шаблона, инструмента, редакции внешнего источника или требований конкретного внедрения фиксируется в соответствующем управляемом документе и не требует изменения Конституции, если оно не затрагивает положения, перечисленные в первом абзаце.

    Предложение об изменении Конституции может внести любой участник проекта. В предложении указываются основание изменения, затрагиваемые положения, ожидаемые последствия и связанные документы, которые потребуется актуализировать. ROLE-PROCESS-OWNER организует анализ, согласование и представление изменения на утверждение в соответствии с разделом 5.4.

    До вступления в силу новой версии применяется действующая версия Конституции. Применимые требования закона, иного нормативного правового акта или договора выполняются независимо от того, отражены ли они в действующей версии Конституции.
- heading: 5.4. Исключения и утверждение
  text: |-
    Новую версию Конституции представляет на утверждение ROLE-PROCESS-OWNER. До представления на утверждение должны быть заполнены все нормативные положения, устранены противоречия и терминологические разногласия, проведена независимая проверка. Комментарии, рекомендации, проекты формулировок и другие служебные материалы в утверждаемую версию не включаются.

    Версию Конституции утверждает ROLE-RELEASE-AUTHORITY. ROLE-DOCUMENTATION-OWNER регистрирует и публикует утверждённую версию, обеспечивает её доступность и сохраняет предыдущую версию с отметкой о прекращении её действия. Новая версия вступает в силу с указанной в ней даты, но не ранее даты публикации. Участники проекта и используемые средства ИИ должны иметь возможность однозначно определить действующую версию Конституции.

    Обоснованное несогласие с отдельным положением рассматривается до утверждения версии и прилагается к решению об утверждении. Если версия утверждена, зафиксированное несогласие не приостанавливает её действие.

    Временное отступление от правила Конституции может быть разрешено только для конкретной ситуации и на установленный срок. Предложение об отступлении готовит ROLE-PROCESS-OWNER. Роль, отвечающая за содержание соответствующего правила, оценивает последствия и риски предлагаемого отступления. Окончательное решение принимает ROLE-RELEASE-AUTHORITY.

    Решение о временном отступлении должно содержать правило, к которому оно относится, область и основание применения, срок действия, владельца риска и меры по снижению риска. По окончании установленного срока отступление прекращает действовать. Если отступление должно стать постоянным, изменение оформляется в порядке, установленном разделом 5.3.

    Временное отступление не может отменять или ослаблять применимые требования закона, иного нормативного правового акта или договора.
- heading: Приложение A. Критичные термины Конституции
  text: |-
    Приложение содержит выдержку из реестра терминов с терминами, необходимыми для однозначного понимания Конституции. В него включаются только понятия, различное толкование которых может изменить смысл правил, границ продукта, полномочий ролей, этапов или гейтов. Остальные термины ведутся в реестре терминов и в приложении не дублируются.
- heading: A.1. Статусы терминов
  text: |-
    Статус термина, используемого в Конституции, ведётся в реестре терминов и определяет возможность его включения в проект или утверждённую версию Конституции.

    **candidate: **Термин предложен, но ещё не разрешён для нормативного использования.

    **approved: **Термин утверждён и используется в установленном значении.

    **deprecated: **Новое использование запрещено; указывается замена или причина её отсутствия.

    В утверждённой версии Конституции и приложении А используются только термины со статусом approved. Результаты автоматической проверки терминологии учитываются отдельно и не изменяют статус термина.

    **Результаты проверки употребления термина:**

    **TERM_PASS: **Термин однозначно разрешён в указанной области.

    **TERM_ALIAS: **Заменить допустимый синоним предпочтительным названием или явно сохранить alias.

    **TERM_NOT_DEFINED: **Остановить зависимое решение и запросить определение у владельца.

    **TERM_AMBIGUOUS: **Разрешить конфликт значений до перехода через затронутый гейт.

    **TERM_SCOPE_MISMATCH: **Уточнить область или использовать термин, действующий в текущем контексте.

    **TERM_DEPRECATED: **Использовать указанную замену; новое употребление запрещено.

    **TERM_CANDIDATE: **Не использовать как нормативное основание до утверждения.
- heading: A.2. Правило включения нового термина
  text: |-
    Новый термин включается в приложение А, если он используется в Конституции и без его определения возможно различное понимание её положений. До включения термин регистрируется в реестре терминов и утверждается в порядке, установленном разделами 5.1 и 5.2.
- heading: A.3. Исходы функциональной приёмки
  text: |-
    Исходы применяются по RULE-ACCEPTANCE-006; порядок их установления — в Регламенте функциональной приёмки.
rules:
- id: RULE-PRODUCT-FRAME-001
  title: Рамку продукта определяет владелец продукта
  text: |-
    Назначение, ценность и границы развиваемой MES — что входит и что не входит — определяет ROLE-PRODUCT-OWNER в описании продукта; функциональные требования и функциональная архитектура разрабатываются только в этих границах.
- id: RULE-PRODUCT-FRAME-002
  title: Правила применяются к любому развиваемому продукту
  text: |-
    Функциональная и техническая архитектура и правила о них применяются к любому развиваемому продукту, не только к MES; делится ли продукт на модули и на какие, определяет ROLE-PRODUCT-OWNER, а если не делится, правила о модулях относятся к продукту целиком.
- id: RULE-SCOPE-001
  title: Основной модуль объекта и функции
  text: |-
    Для каждого предметного объекта и каждой функции определяется основной функциональный модуль. Функциональный архитектор этого модуля определяет их модель, состояния, жизненный цикл, правила использования и допустимые изменения. Другие модули используют его функции и данные только через согласованные интерфейсы, события или ссылки, без прямого изменения чужих данных. Для межмодульных сценариев границы ответственности и порядок взаимодействия фиксируются в функциональной архитектуре участвующих модулей.
- id: RULE-SCOPE-002
  title: Отнесение к модулям и межмодульные термины
  text: |-
    Отнесение бизнес-функций и сущностей к модулям и значение межмодульных терминов согласуют функциональные архитекторы затронутых модулей, при разногласии решает ROLE-PRODUCT-OWNER; ROLE-TECHNICAL-ARCHITECT возвращает отнесение на доработку, только если оно противоречит функциональной архитектуре или требованиям к качеству, указав положение и причину.
- id: RULE-SCOPE-003
  title: Общие элементы функциональной архитектуры
  text: |-
    Для элементов функциональной архитектуры, общих для всех модулей и не имеющих основного модуля, — единой ролевой модели, общих правил — ответственного функционального архитектора назначает ROLE-PRODUCT-OWNER.
- id: RULE-PRODUCT-UNITY-001
  title: Единый продукт для всех внедрений
  text: |-
    СИГМА.MES+ развивается как единый продукт для всех внедрений; различия между предприятиями обеспечиваются средствами продукта. Отдельный вариант для предприятия допускается только по решению ROLE-PRODUCT-OWNER, с владельцем, обоснованием и условием возврата в продукт или прекращения. Вариант без владельца и условий сопровождения не допускается.
- id: RULE-ARCH-001
  title: Техническое решение требует доказательства
  text: |-
    Каждое техническое архитектурное решение должно обеспечивать конкретную ценность для продукта или проекта и иметь проверяемое обоснование.

    При выборе решения учитываются требования, риски и возможные альтернативы. Выбранный вариант должен быть обоснован результатами расчётов, проверки прототипа, испытаний или другими проверяемыми данными. Состав и объём подтверждающих материалов должны соответствовать значимости и риску решения.
- id: RULE-ARCH-002
  title: Способ реализации определяет техническая архитектура
  text: |-
    Способ реализации определяет только техническая архитектура — на основе функциональной архитектуры, функциональных требований и требований к качеству.
- id: RULE-DATA-001
  title: Авторитетный источник состояния объекта
  text: |-
    Для каждого ключевого производственного объекта в функциональной архитектуре указываются модуль, отвечающий за его данные, и модуль или внешняя система, являющиеся авторитетным источником его состояния. Если отдельные атрибуты объекта ведутся в разных модулях или системах, границы ответственности указываются отдельно.
- id: RULE-DATA-002
  title: Данные и обмен с внешними системами
  text: |-
    Данные и обмен с внешними системами функциональная архитектура описывает бизнес-сущностями, их правилами и событиями; протоколы, форматы, расписание обмена, ключи, коды и способ хранения определяет только техническая архитектура.
- id: RULE-QUALITY-001
  title: Требование к качеству задаётся потребностью
  text: |-
    Требование к качеству задаётся производственной потребностью, а не возможностями выбранного решения. Требование к качеству утверждает ROLE-FUNCTIONAL-ARCHITECT, и только он может его ослабить, с обоснованием риска. Внешнее обязательное требование внутренним решением не ослабляется.
- id: RULE-QUALITY-002
  title: Значения требований к качеству и способ их обеспечения
  text: |-
    Требования к качеству — производительность, отказоустойчивость, масштабируемость, информационную безопасность и автономность работы производственных площадок — задают функциональные архитекторы значениями из производственной потребности; способ их обеспечения определяет только техническая архитектура.
- id: RULE-SECURITY-001
  title: Защита определяется применимостью и риском
  text: |-
    СИГМА.MES+ разрабатывается и развивается с соблюдением применимых требований законодательства и действующих документов СИГМА и Интер РАО в области информационной безопасности.
- id: RULE-REQ-001
  title: Функции, объекты, данные и правила описываются один раз
  text: |-
    Функции, объекты, данные и правила описываются один раз — в функциональной архитектуре; функциональное требование ссылается на них и добавляет источник, обоснование и критерии приёмки.
- id: RULE-REQ-002
  title: Включение функционального требования
  text: |-
    Предложить функциональное требование может любой источник, а включить его в согласованный набор требований — только функциональные архитекторы затронутых модулей, при разногласии — ROLE-PRODUCT-OWNER.
- id: RULE-REQ-003
  title: Техническое ограничение только с внешним источником
  text: |-
    Техническое требование или ограничение, задающее способ реализации, включается в согласованный набор требований только с указанием внешнего источника, обязывающего его выполнить, — заказчика, его ИТ-специалистов или регулятора; ROLE-PRODUCT-OWNER и функциональные архитекторы таких ограничений от себя не задают.
- id: RULE-REQ-004
  title: Требования передаются с достаточной функциональной архитектурой
  text: |-
    Функциональные требования передаются в техническую архитектуру, разработку и приёмку только вместе с функциональной архитектурой, достаточной, чтобы эти работы выполнялись без вопросов к функциональным архитекторам; каждый такой вопрос фиксируется как недостаток функциональной архитектуры.
- id: RULE-ACCEPTANCE-001
  title: Предмет функциональной приёмки
  text: |-
    ROLE-FUNCTIONAL-ARCHITECT принимает реализованную функциональность, а не программный код или экран интерфейса: её соответствие функциональной архитектуре и функциональным требованиям, правильность встраивания в производственный процесс и сохранение функциональной целостности продукта.
- id: RULE-ACCEPTANCE-002
  title: Основание функциональной приёмки
  text: |-
    Функциональность принимается только по критериям приёмки функциональных требований и положениям функциональной архитектуры, на которые они ссылаются; функциональность, для которой их нет, не принимается.
- id: RULE-ACCEPTANCE-003
  title: Полнота функциональной приёмки
  text: |-
    Приёмка проверяет функциональность во всех сценариях, состояниях и переходах объектов, правах ролей, условиях бизнес-правил и последствиях для связанных функций и данных, предусмотренных функциональной архитектурой, а не только в основном сценарии; функциональную целостность функциональный архитектор проверяет по всему продукту, а не только по своему модулю.
- id: RULE-ACCEPTANCE-004
  title: Передача на функциональную приёмку
  text: |-
    ROLE-DEVELOPER передаёт функциональность на функциональную приёмку только после PASS тестовых сценариев, вместе с описанием реализованного — функций, изменённых объектов и сценариев — и всех отличий от функциональной архитектуры.
- id: RULE-ACCEPTANCE-005
  title: Тестирование и функциональная приёмка
  text: |-
    Тест-кейсы строит ROLE-TEST-ENGINEER по критериям приёмки и сценариям функциональной архитектуры, а функциональный архитектор при приёмке проверяет их покрытие; достаточность доказательств определяет ROLE-VERIFICATION-OWNER, исход приёмки он не меняет.
- id: RULE-ACCEPTANCE-006
  title: Исходы функциональной приёмки
  text: |-
    Результат функциональной приёмки фиксируется одним из исходов приложения A.3 — «Принято», «Принято с замечаниями», «На доработку» или «Отклонено архитектурно»; замечания исхода «Принято с замечаниями» регистрируются как элементы работ.
- id: RULE-ACCEPTANCE-007
  title: Регламент функциональной приёмки
  text: |-
    Порядок функциональной приёмки устанавливает Регламент функциональной приёмки, который ведёт ROLE-FUNCTIONAL-ARCHITECT и публикует ROLE-DOCUMENTATION-OWNER; регламент не противоречит Конституции.
- id: RULE-FA-CHANGE-001
  title: Отклонение реализации от функциональной архитектуры
  text: |-
    Отклонение реализации от функциональной архитектуры принимается только как изменение функциональной архитектуры, внесённое её функциональным архитектором до приёмки; изменение, затрагивающее другие модули, согласуют их функциональные архитекторы, при разногласии решает ROLE-PRODUCT-OWNER.
- id: RULE-FA-CHANGE-002
  title: Решение после исхода «Отклонено архитектурно»
  text: |-
    После исхода «Отклонено архитектурно» функциональный архитектор решает, переделывается ли реализация под функциональную архитектуру или функциональная архитектура изменяется по RULE-FA-CHANGE-001.
- id: RULE-SCENARIO-001
  title: Сквозной сценарий развивается вместе с продуктом
  text: |-
    Для проверки функциональности продукта разрабатываются типовые сквозные производственные сценарии. Каждый сценарий содержит исходные данные, последовательность действий системы и пользователей, а также ожидаемый производственный результат.

    Если изменяется функциональность, используемая в сценарии, сценарий актуализируется и проверяется повторно. Проверка отдельных функций не заменяет проверку полного сквозного сценария.

    Сквозные сценарии проверяются сквозной функциональной приёмкой, по результатам которой ROLE-FUNCTIONAL-ARCHITECT даёт заключение к GATE-03.
- id: RULE-TERM-001
  title: Предметный смысл определяется до реализации
  text: |-
    Решение, зависящее от критичного термина, не утверждается, пока для применимой области не установлены его предпочтительное русское наименование, стабильный технический идентификатор на английском языке, определение на русском языке, владелец, а запись не получила term_status=approved. Допускается применять к определению синонимы. Зарегистрированный alias допускается только как ссылка на такой утверждённый термин. Неразрешённая неоднозначность блокирует только затронутое решение или гейт.
- id: RULE-TERM-002
  title: Значение термина задаёт только реестр
  text: |-
    Термины имеют только значения, утверждённые по Конституции в реестре терминов; все документы и ИТ-системы проекта применяют их без изменений, а внешние стандарты их не меняют.
- id: RULE-TERM-003
  title: Единственный источник терминов для людей и средств ИИ
  text: |-
    Реестр терминов — единственный источник значений терминов для людей и средств ИИ; средства ИИ получают термины только из его действующей редакции, средство ведения реестра определяет ROLE-DOCUMENTATION-OWNER, а доступ к нему средств ИИ разрешает ROLE-AI-USE-CASE-OWNER.
- id: RULE-FACT-001
  title: Наблюдение, утверждение и производственный факт различаются
  text: |-
    План, команда, состояние, сигнал оборудования, сообщение системы, ручной ввод или подтверждение пользователя сами по себе не являются производственным фактом и не могут использоваться как взаимозаменяемые сведения.

    Наблюдение может быть признано производственным фактом только по установленному правилу. Для каждого производственного факта должны быть определены стабильный идентификатор, объект, время события и регистрации, источник, автор или устройство, контекст и версия применённого правила.

    Происхождение данных должно позволять определить, откуда получены сведения, какие проверки и преобразования они прошли и на каком основании признаны производственным фактом. Исправление факта не должно удалять первоначальную запись и историю изменений.
- id: RULE-AI-001
  title: ИИ не заменяет ответственность человека
  text: |-
    ИИ готовит материалы, рекомендации и проверки, но не принимает решений. Термин, требование, решение функциональной или технической архитектуры, остаточный риск, гейт и выпуск утверждает профильная роль, и за результат, подготовленный с помощью ИИ, она отвечает так же, как за подготовленный лично. ИИ применяется только в условиях, разрешённых ROLE-AI-USE-CASE-OWNER: данные, источники, модель, инструкция и способ проверки. Смена этих условий требует повторного разрешения.
- id: RULE-AI-002
  title: Персональный ИИ не является памятью проекта
  text: |-
    Знанием проекта для ИИ считаются только действующие редакции правил, терминов, требований и решений, опубликованные ROLE-DOCUMENTATION-OWNER. Память, история диалогов и личные инструкции ИИ-помощника знанием проекта не являются. Если основания в действующих материалах нет, ИИ прямо сообщает об этом и не восполняет пробел из собственных знаний.
roles:
- id: ROLE-PRODUCT-OWNER
  name: Владелец продукта
  status: active
  responsibility: Назначение, ценность, границы и общие приоритеты СИГМА.MES+. Рамка продукта и состав
    модулей (RULE-PRODUCT-FRAME-001, RULE-PRODUCT-FRAME-002).
  authority: Утверждает цели и продуктовые границы; останавливает работу, потерявшую продуктовую ценность.
    Решает разногласия функциональных архитекторов (RULE-SCOPE-002, RULE-REQ-002, RULE-FA-CHANGE-001);
    назначает ответственного функционального архитектора общих элементов функциональной архитектуры (RULE-SCOPE-003).
  openup: Stakeholder; ведёт продуктовую часть Vision (отступление, раздел 1.5).
- id: ROLE-FUNCTIONAL-ARCHITECT
  name: Функциональный архитектор
  status: active
  responsibility: Функциональная архитектура и функциональные требования закреплённых модулей M01–M13
    или иной функциональной области; предметная корректность и функциональная целостность продукта; значения
    требований к качеству; функциональная приёмка реализованной функциональности.
  authority: Утверждает понятия, состояния и требования к качеству; включает функциональные требования
    в согласованный набор (RULE-REQ-002); принимает реализованную функциональность с исходами приложения
    A.3; вносит изменения в функциональную архитектуру (RULE-FA-CHANGE-001); блокирует неоднозначное решение.
  openup: Analyst.
- id: ROLE-TECHNICAL-ARCHITECT
  name: Технический архитектор
  status: active
  responsibility: 'Техническая архитектура: её целостность, границы программных компонентов, технические
    риски и способ обеспечения требований к качеству. Ведёт Architecture Notebook как набор архитектурных
    записей решений (ADR).'
  authority: Принимает технические архитектурные решения; блокирует технически недоказанное или противоречивое
    решение; возвращает отнесение функций и сущностей к модулям только по RULE-SCOPE-002.
  openup: Architect.
- id: ROLE-DEVELOPER
  name: Разработчик
  status: active
  responsibility: Проектирование, реализация, модульная проверка и техническая документация изменения.
    Описание реализованного при передаче на функциональную приёмку (RULE-ACCEPTANCE-004).
  authority: Выбирает способ реализации в установленных границах; обязан зарегистрировать противоречие;
    не утверждает свой высокий риск единолично.
  openup: Developer.
- id: ROLE-TEST-ENGINEER
  name: Инженер по тестированию
  status: active
  responsibility: Тест-дизайн по критериям приёмки и сценариям функциональной архитектуры, тестовые сценарии,
    функциональная и интеграционная проверка, регистрация дефектов.
  authority: Присваивает PASS или FAIL тестовому сценарию и блокирует передачу на функциональную приёмку
    при незакрытом дефекте; готовит доказательства, но не признаёт их достаточными.
  openup: Tester (исполнение проверки).
- id: ROLE-PROJECT-MANAGER
  name: Руководитель проекта
  status: active
  responsibility: Планирование, итерации, зависимости, ресурсы, сроки и проектные риски. Ведёт план итерации
    (Iteration Plan), список рисков (Risk List) и список элементов работ (Work Items List).
  authority: Принимает организационные решения; не утверждает предметный смысл и остаточный технический
    риск.
  openup: Project Manager.
- id: ROLE-PROCESS-OWNER
  name: Владелец Конституции и процесса
  status: active
  responsibility: Целостность Конституции, этапов, гейтов и общей терминологии.
  authority: Организует изменение Конституции; останавливает переход при конфликте общих правил; организует
    устранение разногласий по терминам, затрагивающим области разных ролей (раздел 5.2).
  openup: Локальное расширение.
- id: ROLE-DOCUMENTATION-OWNER
  name: Владелец управляемой документации и знаний
  status: active
  responsibility: Идентификация, классификация, версии, публикация, вывод из действия и доступность управляемых
    материалов.
  authority: Устанавливает статус и доступность материала; блокирует использование неидентифицированной
    или неактуальной редакции; не утверждает её предметное содержание вместо профильной роли.
  openup: Локальное расширение.
- id: ROLE-VERIFICATION-OWNER
  name: Ответственный за проверку
  status: active
  responsibility: Стратегия проверки, независимость оценки и качество доказательств. Проверяет выполнение
    процедур документирования и соблюдение установленных правил документирования.
  authority: Определяет достаточность проверки; блокирует неподтверждённый PASS; не меняет требование
    ради теста и не меняет исход функциональной приёмки.
  openup: Часть обязанностей Tester — стратегия и достаточность проверки (отступление, раздел 1.5).
- id: ROLE-DELIVERY-LEAD
  name: Руководитель разработки
  status: active
  responsibility: Организация реализации, интеграции, сборки и технической готовности приращения.
  authority: Подтверждает готовность кандидата к интеграционной проверке; не подменяет функциональную
    и выпускную приёмку.
  openup: Локальное расширение.
- id: ROLE-SERVICE-OWNER
  name: Владелец сервиса
  status: active
  responsibility: Эксплуатационная готовность, поддержка, наблюдаемость, восстановление и завершение жизненного
    цикла. Отвечает за подтверждённую процедуру отката и эксплуатацию демо-контуров, включая доступы,
    данные и восстановление.
  authority: Принимает или блокирует эксплуатационную готовность; инициирует ограничение, откат или прекращение
    эксплуатации.
  openup: Локальное расширение.
- id: ROLE-SECURITY-OWNER
  name: Владелец безопасности
  status: active
  responsibility: Риски защиты продукта, данных, интеграций, разработки и эксплуатации.
  authority: Блокирует неприемлемый риск и подтверждает защитные доказательства в своей области. Выдаёт
    заключение по результатам статического и динамического анализа безопасности (SAST и DAST) в CI/CD.
    Правила совмещения с функциями DevOps — раздел 4.1.
  openup: Локальное расширение.
- id: ROLE-RELEASE-AUTHORITY
  name: Уполномоченная роль выпуска
  status: active
  responsibility: Итоговое решение о выпуске на основании заключений и остаточного риска.
  authority: Разрешает, откладывает или запрещает выпуск; принимает остаточный риск в пределах полномочий.
    Решение о выпуске принимает на основании обязательных заключений ROLE-VERIFICATION-OWNER и ROLE-SECURITY-OWNER
    и зарегистрированного остаточного риска; с ROLE-DELIVERY-LEAD не совмещается (раздел 4.1).
  openup: Локальное расширение.
- id: ROLE-AI-USE-CASE-OWNER
  name: Владелец применения ИИ
  status: active
  responsibility: Допустимые задачи, данные, инструменты, автономность, проверки и ограничения ИИ.
  authority: Разрешает, ограничивает или прекращает применение ИИ; не утверждает созданное ИИ решение
    вместо профильной роли.
  openup: Локальное расширение.
- id: ROLE-DEMO-OWNER
  name: Владелец демо-контура
  status: active
  responsibility: Состав и актуальность демо-контура, демонстрируемые сценарии и обязательства перед клиентами
    в активных сделках.
  authority: Определяет содержание демо и инициирует запрос на изменение с обоснованием от сделки; не
    подтверждает эксплуатационную готовность и не даёт заключений на гейтах продукта.
  openup: Локальное расширение.
- id: ROLE-INDEPENDENT-REVIEWER
  name: Независимый рецензент
  status: active
  responsibility: Критическая проверка предположений, доказательств, терминологии и непротиворечивости.
  authority: Выдаёт PASS, REWORK или STOP-RECOMMENDED; не подменяет ответственную роль гейта.
  openup: Локальное расширение.
  carrier_requirement: внешний эксперт, не представляющий заказчика или команду проекта.
- id: ROLE-FUNCTIONAL-OWNER
  name: Функциональный владелец
  status: deprecated
  replacement: ROLE-FUNCTIONAL-ARCHITECT
- id: ROLE-ARCHITECT
  name: Архитектор решения
  status: deprecated
  replacement: ROLE-TECHNICAL-ARCHITECT
stages_gates:
- stage: STAGE-01
  gate: GATE-01
  name: Инициация (Inception)
  goal: Согласовать ценность, область и основные риски.
  result_state: Понятны назначение, границы, участники, критичные сценарии и терминологические неоднозначности.
  responsible_role: ROLE-PRODUCT-OWNER
  required_conclusions:
  - ROLE-FUNCTIONAL-ARCHITECT
  - ROLE-PROJECT-MANAGER
  - ROLE-INDEPENDENT-REVIEWER
- stage: STAGE-02
  gate: GATE-02
  name: Проработка (Elaboration)
  goal: Снять значимые требования и архитектурные риски.
  result_state: Значимые требования согласованы, и функциональная архитектура для них достаточна по RULE-REQ-004;
    критичные термины определены; рискованный сквозной срез подтверждает реализуемость.
  responsible_role: ROLE-TECHNICAL-ARCHITECT
  required_conclusions:
  - ROLE-FUNCTIONAL-ARCHITECT
  - ROLE-VERIFICATION-OWNER
  - ROLE-INDEPENDENT-REVIEWER
- stage: STAGE-03
  gate: GATE-03
  name: Построение (Construction)
  goal: Создать и проверить требуемое решение.
  result_state: Интегрированный результат реализует согласованный сценарий и прошёл сквозную функциональную
    приёмку; ограничения и риски известны.
  responsible_role: ROLE-DELIVERY-LEAD
  required_conclusions:
  - ROLE-TECHNICAL-ARCHITECT
  - ROLE-FUNCTIONAL-ARCHITECT
  - ROLE-VERIFICATION-OWNER
  - ROLE-SERVICE-OWNER
  - ROLE-SECURITY-OWNER
- stage: STAGE-04
  gate: GATE-04
  name: Переход (Transition)
  goal: Подтвердить пригодность и подготовить использование.
  result_state: Пользователи и эксплуатация подтвердили результат, ограничения, миграцию, восстановление,
    подтверждённую процедуру отката и поддержку.
  responsible_role: ROLE-RELEASE-AUTHORITY
  required_conclusions:
  - ROLE-PRODUCT-OWNER
  - ROLE-FUNCTIONAL-ARCHITECT
  - ROLE-VERIFICATION-OWNER
  - ROLE-SECURITY-OWNER
  - ROLE-SERVICE-OWNER
- stage: STAGE-05
  gate: GATE-05
  name: Эксплуатация и развитие
  goal: Контролировать ценность и качество работающего продукта.
  result_state: Понятны фактический эффект, качество сервиса, инциденты и необходимость изменений.
  responsible_role: ROLE-SERVICE-OWNER
  required_conclusions:
  - ROLE-PRODUCT-OWNER
  - ROLE-SECURITY-OWNER
  - ROLE-FUNCTIONAL-ARCHITECT
- stage: STAGE-06
  gate: GATE-06
  name: Завершение жизненного цикла
  goal: Безопасно прекратить использование продукта или версии.
  result_state: Данные, обязательства, пользователи, доступы и зависимости обработаны.
  responsible_role: ROLE-SERVICE-OWNER
  required_conclusions:
  - ROLE-PRODUCT-OWNER
  - ROLE-FUNCTIONAL-ARCHITECT
  - ROLE-SECURITY-OWNER
  - ROLE-INDEPENDENT-REVIEWER
acceptance_outcomes:
- code: ACCEPTED
  name: Принято
  text: '**Значение: **Функциональность полностью соответствует функциональным требованиям и функциональной
    архитектуре.'
- code: ACCEPTED_WITH_REMARKS
  name: Принято с замечаниями
  text: '**Значение: **Есть несущественные отклонения, не препятствующие использованию; каждое замечание
    регистрируется как элемент работ.'
- code: RETURNED
  name: На доработку
  text: '**Значение: **Есть функциональные несоответствия функциональным требованиям или функциональной
    архитектуре.'
- code: REJECTED_ARCHITECTURALLY
  name: Отклонено архитектурно
  text: '**Значение: **Функция технически работает, но реализация противоречит действующей функциональной
    архитектуре; решение принимается по RULE-FA-CHANGE-002.'
terms:
- id: TERM-CONSTITUTION
  name: Конституция проекта
  definition: Утверждённый общий набор устойчивых правил, границ полномочий и условий прохождения SDLC
    для всех команд СИГМА.MES+.
  difference: Не техническая архитектура, требования модуля или инструкция разработчика.
  responsible_role: ROLE-PROCESS-OWNER
- id: TERM-PRODUCT
  name: Продукт
  definition: Развиваемое решение — СИГМА.MES+ или иной продукт, к которому Конституция применяется по
    RULE-PRODUCT-FRAME-002, — с общей ценностью, границей, жизненным циклом и ответственностью.
  difference: Не отдельный проект внедрения, сборка или коммерческая редакция.
  responsible_role: ROLE-PRODUCT-OWNER
- id: TERM-PARAMETRIC-CORE
  name: Параметрическое ядро с поддержкой плагинов
  definition: Общая часть продукта, задающая исполняемые контракты, параметры и контролируемое подключение
    расширений.
  difference: Не конкретный механизм загрузки, язык реализации или отдельный функциональный модуль.
  responsible_role: ROLE-TECHNICAL-ARCHITECT
- id: TERM-ENGINEERING-SPECIFICATION
  name: Спецификация изделия по ЕСКД
  definition: Конструкторский документ, фиксирующий состав специфицируемого изделия и относящиеся к нему
    конструкторские документы.
  difference: Не технологический процесс, производственное задание, спецификация требований к ПО или спецификация
    интерфейса.
  responsible_role: ROLE-FUNCTIONAL-ARCHITECT
- id: TERM-COMMON-RULE
  name: Общее правило
  definition: Положение для нескольких команд, модулей или этапов, сохраняющее смысл при смене технологии.
  difference: Не локальная договорённость, рекомендация или пример.
  responsible_role: ROLE-PROCESS-OWNER
- id: TERM-SDLC-STAGE
  name: Этап SDLC
  definition: Часть жизненного цикла с определённой целью и связанной точкой решения о готовности продолжать
    работу.
  difference: Не итерация, календарный период или статус задачи.
  responsible_role: ROLE-PROJECT-MANAGER
- id: TERM-ITERATION
  name: Итерация
  definition: Ограниченный цикл внутри этапа, завершающийся проверяемым результатом или снижением риска.
  difference: Не этап SDLC и не только календарный спринт.
  responsible_role: ROLE-PROJECT-MANAGER
- id: TERM-GATE
  name: Гейт
  definition: Человеческое решение о переходе, выпуске, продолжении эксплуатации или завершении жизненного
    цикла на основании доказательств.
  difference: Не совещание, чек-лист, дата или статус CI.
  responsible_role: ROLE-PROCESS-OWNER
- id: TERM-EVIDENCE
  name: Доказательство
  definition: Проверяемая информация, подтверждающая или опровергающая правило, требование или условие
    гейта в определённой версии и области.
  difference: Не само наличие документа, мнение или заявление автора.
  responsible_role: ROLE-VERIFICATION-OWNER
- id: TERM-ROLE
  name: Роль
  definition: Устойчивая совокупность ответственности и полномочий, не зависящая от фамилии или должности.
  difference: Не сотрудник, подразделение или ИИ-агент.
  responsible_role: ROLE-PROCESS-OWNER
- id: TERM-ACCOUNTABLE-ROLE
  name: Ответственная роль
  definition: Единственная роль, отвечающая за полноту и регистрацию решения, включая обязательные заключения.
  difference: Не единственный исполнитель или участник решения.
  responsible_role: ROLE-PROCESS-OWNER
- id: TERM-FUNCTIONAL-SCOPE
  name: Функциональная область
  definition: Ограниченная часть предметной ответственности продукта, закреплённая за функциональным архитектором.
  difference: Не компонент, сервис или команда разработки.
  responsible_role: ROLE-PRODUCT-OWNER
- id: TERM-FUNCTIONAL-MODULE
  name: Функциональный модуль
  definition: Устойчивая область возможностей продукта в составе модулей, определённом ROLE-PRODUCT-OWNER
    по RULE-PRODUCT-FRAME-002; для СИГМА.MES+ — модули M01–M13 раздела 1.3.1.
  difference: Не микросервис, сборка, репозиторий или экран.
  responsible_role: ROLE-PRODUCT-OWNER
- id: TERM-CRITICAL-TERM
  name: Критичный термин
  definition: Понятие, неоднозначность которого меняет объект, состояние, владельца, границу, право, требование
    или гейт.
  difference: Не любое профессиональное слово или сокращение.
  responsible_role: ROLE-FUNCTIONAL-ARCHITECT
- id: TERM-CRITICAL-BUSINESS-OBJECT
  name: Критичный производственный объект
  definition: Объект, ошибка в определении или жизненном цикле которого искажает планирование, исполнение,
    качество, НЗП, прослеживаемость или аналитику.
  difference: Не техническая таблица или DTO.
  responsible_role: ROLE-FUNCTIONAL-ARCHITECT
- id: TERM-SEMANTIC-OWNER
  name: Владелец смысла
  definition: Функциональный архитектор основного модуля объекта, отвечающий за его определение, состояния,
    жизненный цикл и предметную интерпретацию (RULE-SCOPE-001).
  difference: Не администратор данных, владелец БД или разработчик сервиса.
  responsible_role: ROLE-FUNCTIONAL-ARCHITECT
- id: TERM-AUTHORITATIVE-STATE-SOURCE
  name: Авторитетный источник состояния
  definition: Система или область, уполномоченная задавать состояние объекта или атрибута в определённом
    периоде и контексте.
  difference: Не гарантия истинности записи и не обязательно единственное место хранения.
  responsible_role: ROLE-FUNCTIONAL-ARCHITECT
- id: TERM-APPLICABILITY-PROFILE
  name: Профиль применимости
  definition: Утверждённая запись о применимости конкретного положения внешнего источника или внутреннего
    правила, содержащая отдельно класс нормативного отношения и состояние решения, а также условие, область
    и требуемое доказательство.
  difference: Не простая ссылка на стандарт или заявление о соответствии.
  responsible_role: ROLE-PROCESS-OWNER (правила ведения); решение о применимости — owner_role_id соответствующей
    записи
- id: TERM-END-TO-END-SCENARIO
  name: Сквозной производственный сценарий
  definition: Последовательность от основания или события до проверяемого результата через необходимых
    участников, объекты, модули и внешние границы.
  difference: Не полная реализация всех модулей и не изолированный тест сервиса.
  responsible_role: ROLE-FUNCTIONAL-ARCHITECT
- id: TERM-INTENT
  name: Намерение
  definition: Требуемый или планируемый производственный результат, ещё не доказывающий выполнение.
  difference: Не команда, состояние или производственный факт.
  responsible_role: ROLE-FUNCTIONAL-ARCHITECT
- id: TERM-COMMAND
  name: Команда
  definition: Авторизованный запрос попытаться выполнить действие над определённым объектом.
  difference: Не намерение, факт выполнения или внутренний переход состояния.
  responsible_role: ROLE-FUNCTIONAL-ARCHITECT
- id: TERM-STATE
  name: Состояние
  definition: Признанное положение объекта на момент времени, полученное по установленным фактам и правилам.
  difference: Не команда, событие или произвольный UI-статус.
  responsible_role: ROLE-FUNCTIONAL-ARCHITECT
- id: TERM-OBSERVATION
  name: Наблюдение
  definition: Полученное от человека, оборудования или системы свидетельство о возможном событии, ещё
    не прошедшее установленную процедуру признания.
  difference: Не производственный факт и не команда.
  responsible_role: ROLE-FUNCTIONAL-ARCHITECT
- id: TERM-PRODUCTION-FACT
  name: Производственный факт
  definition: Признанная по установленному правилу запись о произошедшем событии со стабильным ID, объектом,
    временем, источником, контекстом и версией правила признания.
  difference: Не план, команда, телеметрия, наблюдение или неподтверждённое действие.
  responsible_role: ROLE-FUNCTIONAL-ARCHITECT
- id: TERM-DATA-PROVENANCE
  name: Происхождение данных
  definition: Проверяемая связь записи с источником, временем, автором или устройством, преобразованиями
    и правилами, повлиявшими на её значение.
  difference: Не только технический журнал или имя таблицы.
  responsible_role: ROLE-VERIFICATION-OWNER
- id: TERM-QUALITY-REQUIREMENT
  name: Требование к качеству
  definition: Измеримое условие того, насколько хорошо и при каких нагрузках, отказах или ограничениях
    должен работать продукт.
  difference: Не фактически достигнутый показатель реализации и не способ его обеспечения, который определяет
    техническая архитектура.
  responsible_role: ROLE-FUNCTIONAL-ARCHITECT
- id: TERM-DEPENDABILITY
  name: Гарантоспособность
  definition: Способность продукта обоснованно обеспечивать требуемое обслуживание с учётом отказов, восстановления,
    ремонтопригодности и сохранности.
  difference: Не только доступность или отсутствие дефектов.
  responsible_role: ROLE-SERVICE-OWNER
- id: TERM-CONTROLLED-DOCUMENT
  name: Управляемый документ
  definition: Идентифицированный материал с назначенным владельцем, версией, статусом, областью применимости
    и сохраняемой историей изменений.
  difference: Не конкретный DMS, Git-репозиторий, папка, архивная копия или автоматически утверждённое
    содержание.
  responsible_role: ROLE-DOCUMENTATION-OWNER
- id: TERM-RESIDUAL-RISK
  name: Остаточный риск
  definition: Риск, остающийся после мер и явно представленный уполномоченной роли для принятия или отказа.
  difference: Не устное допущение или отложенная задача без владельца.
  responsible_role: ROLE-RELEASE-AUTHORITY
- id: TERM-RELEASE
  name: Выпуск
  definition: Идентифицированный результат, разрешённый человеком для применения в определённой области
    и условиях.
  difference: Не commit, merge, ветвь, tag или успешная сборка.
  responsible_role: ROLE-RELEASE-AUTHORITY
- id: TERM-AI-GENERATED-MATERIAL
  name: Материал, созданный ИИ
  definition: Текст, код, модель, решение или анализ, полностью либо частично созданные ИИ и требующие
    профильной человеческой проверки.
  difference: Не утверждённое решение только на основании происхождения.
  responsible_role: ROLE-AI-USE-CASE-OWNER
- id: TERM-FUNCTIONAL-ARCHITECTURE
  name: Функциональная архитектура
  definition: Структурированное представление функциональных возможностей MES на языке предметной области.
    Способ реализации функциональная архитектура не определяет.
  describes:
  - какие производственные, управленческие, информационные и обеспечивающие функции выполняет MES
  - какие функциональные модули и области для этого необходимы
  - как модули взаимодействуют в процессах на уровне бизнес-сущностей
  - какие бизнес-объекты и данные они используют, как устроены эти объекты и данные, как они связаны между
    собой и по каким правилам проверяются — в терминах предметной области
  - состояния бизнес-объектов и допустимые переходы между ними
  - сценарии выполнения функций — основной, альтернативные и исключительные
  - сроки хранения данных
  - алгоритмы бизнес-операций
  - роли пользователей и их права на функции и данные
  - пользовательские интерфейсы, включая UX/UI-макеты экранов
  - с какими внешними системами и оборудованием, какими бизнес-сущностями и по каким событиям выполняется
    обмен
  - как продолжаются процессы при недоступности внешних систем и потере связи
  difference: Не техническая архитектура и не распределение функций по программным компонентам.
  responsible_role: ROLE-FUNCTIONAL-ARCHITECT
- id: TERM-TECHNICAL-ARCHITECTURE
  name: Техническая архитектура
  definition: Структурированное представление программных и технических компонентов MES. Способ реализации
    определяет только она (RULE-ARCH-002).
  defines:
  - какими программными компонентами, инфраструктурными средствами и техническими устройствами реализуются
    функции
  - где эти компоненты физически или виртуально размещаются
  - как они взаимодействуют между собой и с внешними системами
  - по каким сетям и протоколам передаются данные
  - как обеспечиваются требования к качеству
  includes:
  - программную архитектуру — фреймворки, компоненты, сервисы, базы данных, шины событий, брокеры сообщений,
    хранилища и аналитические компоненты, ключи, коды и способ хранения данных, механизмы аутентификации
    и разграничения доступа
  - сетевую архитектуру — сети, зоны информационной безопасности, каналы связи, правила обмена и маршрутизации
  - 'интеграционную архитектуру — как MES технически взаимодействует с другими системами и оборудованием:
    протоколы, форматы и расписание обмена, обработка сбоев обмена и синхронизация данных после восстановления
    связи'
  - архитектуру развёртывания — где физически или виртуально располагаются программные компоненты, как
    выполняются обновление, миграция данных и откат к предыдущей версии, резервное копирование и восстановление,
    мониторинг и журналирование
  difference: Не функциональная архитектура, не существующий код и не прототип.
  responsible_role: ROLE-TECHNICAL-ARCHITECT
- id: TERM-FUNCTIONAL-REQUIREMENT
  name: Функциональное требование
  definition: 'Формализованный запрос заинтересованной стороны к функциональным возможностям MES: какую
    способность, функцию, действие, операцию, информационное взаимодействие или функциональное поведение
    должна обеспечивать MES для поддержки производственного, управленческого или иного процесса. Требование
    ссылается на функциональную архитектуру и добавляет источник, обоснование и критерии приёмки (RULE-REQ-001).'
  difference: Не описание функции в функциональной архитектуре и не техническое требование или ограничение
    (RULE-REQ-003).
  responsible_role: ROLE-FUNCTIONAL-ARCHITECT
- id: TERM-FUNCTIONAL-ACCEPTANCE
  name: Функциональная приёмка
  definition: Решение ROLE-FUNCTIONAL-ARCHITECT о том, что реализованная функциональность корректно реализует
    функциональную архитектуру и функциональные требования во всех существенных производственных сценариях
    и во взаимодействии с остальной системой; проводится по отдельной функциональности (локальная приёмка)
    и по сквозному сценарию (сквозная приёмка).
  difference: Не тестирование, не решение по гейту и не приёмочные испытания заказчика.
  responsible_role: ROLE-FUNCTIONAL-ARCHITECT
- id: TERM-TECHNICAL-ARCHITECTURE-DECISION
  name: Техническое архитектурное решение
  definition: Осознанный выбор способа реализации в технической архитектуре, сопоставленный с требованиями,
    рисками, альтернативами и последствиями.
  difference: Не решение функциональной архитектуры, не существующий код, прототип или личное предпочтение.
  responsible_role: ROLE-TECHNICAL-ARCHITECT
- id: TERM-ARCHITECTURE-DECISION
  name: Архитектурное решение
  status: deprecated
  replacement: TERM-TECHNICAL-ARCHITECTURE-DECISION
  reason: После введения функциональной архитектуры наименование «архитектурное решение» неоднозначно.
- id: TERM-DESIGN-DECISIONS
  name: Проектные решения
  status: deprecated
  replacement: TERM-FUNCTIONAL-ARCHITECTURE и TERM-TECHNICAL-ARCHITECTURE
  reason: Содержание разделено между функциональной и технической архитектурой, а связь требования с реализацией
    и проверкой задают RULE-REQ-001, RULE-ACCEPTANCE-002 и раздел 3.1.
term_statuses:
  candidate: Термин предложен, но ещё не разрешён для нормативного использования.
  approved: Термин утверждён и используется в установленном значении.
  deprecated: Новое использование запрещено; указывается замена или причина её отсутствия.
term_check_results:
  TERM_PASS: Термин однозначно разрешён в указанной области.
  TERM_ALIAS: Заменить допустимый синоним предпочтительным названием или явно сохранить alias.
  TERM_NOT_DEFINED: Остановить зависимое решение и запросить определение у владельца.
  TERM_AMBIGUOUS: Разрешить конфликт значений до перехода через затронутый гейт.
  TERM_SCOPE_MISMATCH: Уточнить область или использовать термин, действующий в текущем контексте.
  TERM_DEPRECATED: Использовать указанную замену; новое употребление запрещено.
  TERM_CANDIDATE: Не использовать как нормативное основание до утверждения.
codes:
  gate_decisions:
  - GO
  - REWORK
  - STOP
  gate_decisions_gate05_extra:
  - RETIRE
  independent_reviewer:
  - PASS
  - REWORK
  - STOP-RECOMMENDED
  test_result:
  - PASS
  - FAIL
  acceptance_outcomes:
  - ACCEPTED
  - ACCEPTED_WITH_REMARKS
  - RETURNED
  - REJECTED_ARCHITECTURALLY
  term_status:
  - candidate
  - approved
  - deprecated
  term_check:
  - TERM_PASS
  - TERM_ALIAS
  - TERM_NOT_DEFINED
  - TERM_AMBIGUOUS
  - TERM_SCOPE_MISMATCH
  - TERM_DEPRECATED
  - TERM_CANDIDATE
