# Машинная проекция продуктового описания (description.yaml).
# Пустая схема: скалярные поля документа и девять массивов.
# Ключи — латиницей; значения (в том числе значения type и confirmation_status) —
# на русском языке, дословно как в перечнях references/statuses.md.
# Экспорт в этот файл не повышает статус подтверждения, не добавляет факт,
# которого нет в модели, и не заполняет поле, которое в модели пусто.

# --- Верхнеуровневые поля документа ---

product_id:              # идентификатор продукта, используется в пути хранения docs/product/<product-id>/
description_version:     # номер версии описания для человеческого чтения, например "0.1"
document_status:         # черновик | незавершённый черновик
date:                    # дата текущей версии, ГГГГ-ММ-ДД
constitution_revision:   # редакция Конституции СИГМА.MES+, на которую опирается версия, например "v0.6"

# Владелец содержания собирается на шаге «Шапка и роли» со слов пользователя (в режиме
# изменения — берётся из приложенного файла) и указывается в шапке description.md, но в
# верхнеуровневые поля этой схемы не входит — это осознанно оставлено открытым вопросом,
# а не восполнено произвольно добавленным полем.

# --- Массив roles_declared ---
# Роли процесса, назначенные для этого продукта, и их носители — СО СЛОВ владельца продукта.
# Собирается на шаге «Шапка и роли» до первого вопроса дерева решений; в режиме изменения
# берётся из приложенного файла. Навык носителей ролей не додумывает: "не назначена" —
# допустимое значение holder и записывается как есть.

roles_declared: []
  # - role: ROLE-PRODUCT-OWNER        # код роли из перечня references/roles-gates.md
  #   holder: "<кто занимает>"        # либо "не назначена"
  #   source: "со слов пользователя"  # иного значения у этого поля не бывает

# --- Массив statements ---
# Каждый элемент — одно положение продуктового описания, независимо от того,
# к какому блоку человеческой проекции (description.md) оно относится.
# Пример ниже закомментирован и показывает все поля, включая awaiting.

statements: []
  # - id: ST-001                        # устойчивый идентификатор положения; сохраняется между версиями документа
  #   text: "<текст положения на русском языке>"
  #   type: "продуктовый выбор"         # наблюдаемый факт | гипотеза | продуктовый выбор | продуктовое ограничение | иллюстрация замысла
  #   confirmation_status: "ожидает заключения роли"
  #     # утверждено ответственной ролью | зафиксировано как предложение | открытый вопрос |
  #     # ожидает заключения роли | ответ роли зафиксирован | требует перепроверки |
  #     # принято к формулировке
  #     # "утверждено ответственной ролью" доступно только разделам 1, 3, 4 и 9 — см. таблицу
  #     # «Раздел → потолок статуса подтверждения» в references/statuses.md
  #     # "принято к формулировке" допустимо только при formulated_by "ИИ" и служит потолком
  #     # для таких положений до переписывания формулировки пользователем
  #   approved_by: ROLE-PRODUCT-OWNER   # ТОЛЬКО при confirmation_status "утверждено ответственной
  #     # ролью"; при любом другом статусе поле отсутствует целиком. В продуктовом описании
  #     # другого значения у этого поля не бывает
  #   formulated_by: "пользователь"      # пользователь | ИИ
  #   awaiting:                          # заполняется ТОЛЬКО при confirmation_status "ожидает заключения роли"
  #                                      # или "ответ роли зафиксирован"; при любом другом статусе поле отсутствует целиком
  #     role: ROLE-ARCHITECT             # код роли из утверждённого перечня
  #     module: M04                      # M01–M13 | "не определено" (порождает открытый вопрос)
  #                                      # | "вне схемы M01–M13" (только со слов пользователя;
  #                                      # открытого вопроса о модуле не порождает, но требует
  #                                      # одного открытого вопроса на документ о применимости схемы)
  #   source: "<ссылка на письмо, реплику в чате или документ>"
  #     # обязательно при confirmation_status "ответ роли зафиксирован"; иначе поле отсутствует
  #   related: []                        # список id связанных положений, может быть пустым
  #   section: 5                         # номер раздела (1–9), к которому относится положение

# --- Массив open_questions ---
# Положение требует ответа, которого пока нет ни от пользователя, ни от роли, ни из источника.

open_questions: []
  # поля элемента: id, text, formulated_by (пользователь | ИИ),
  # section (раздел 1–9, если вопрос относится к конкретному разделу; для процессных
  # вопросов поле отсутствует), related (связанные id из statements; [] если связей нет),
  # status ("открыт" | "закрыт"), resolved_by (id положений или запросов, которыми вопрос
  # закрыт; [] у открытого). Закрытые записи из файла НЕ удаляются, id не переиспользуются;
  # в description.md перечисляются только открытые, закрытые — строкой «закрыт, см. …»

# --- Массив role_requests ---
# Запрос заключения роли. Три поля обязательны всегда: text (что именно требуется
# подтвердить), blocks (какое продуктовое решение блокируется до ответа) и if_declined
# (что произойдёт при отрицательном ответе). Без любого из них запрос не считается
# готовым и не формируется.

role_requests: []
  # поля элемента: id, role (код роли), module (M01–M13 | "не определено" | "вне схемы M01–M13"),
  # text (что именно требуется подтвердить), blocks (какое продуктовое решение
  # блокируется до ответа), if_declined (что произойдёт при отрицательном ответе),
  # linked_statement (id связанного положения; отсутствует, если связи нет),
  # confirmation_status ("ожидает заключения роли" | "ответ роли зафиксирован"),
  # source (обязательно при confirmation_status "ответ роли зафиксирован")

# --- Массив attachments ---
# Материалы, которые принёс пользователь: макеты, образцы данных, внешние системы, нормативы.
# Прикладывается ССЫЛКА, а не содержимое: содержимое файла в description.md и description.yaml
# не копируется. Статус записи о материале всегда "зафиксировано как предложение" и не повышается.

attachments: []
  # - id: AT-001
  #   link: "<ссылка на внутреннее хранилище; не содержимое файла>"
  #   kind: "макет"                    # "макет" | "образец данных" | "внешняя система" | "норматив" | "иное"
  #   extracted: [ST-012, ST-013]      # id положений, извлечённых из материала; текст здесь не дублируется
  #   confirmation_status: "зафиксировано как предложение"   # иного значения у записи о материале не бывает
  #   agreement:                       # кто согласует сам материал по существу; это НЕ ось 3 (awaiting)
  #     role: ROLE-FUNCTIONAL-OWNER
  #     module: M03

# --- Массив term_candidates ---
# Кандидаты критичных терминов для глоссария; term_status двигается только candidate → approved → deprecated.
# Состав записи — контракт из references/terms-registry.md, раздел «Запись термина».

term_candidates: []
  # - id: TC-001
  #   term: "<предпочтительное русское наименование>"
  #   technical_id: TERM-STATE          # отсутствует, пока термин не сопоставлен с реестром
  #   definition: ""                    # в продуктовом описании штатно пусто:
  #     # определение даёт владелец функциональной области, а не владелец продукта
  #   synonyms: []                      # зарегистрированные alias
  #   scope: "не определено"            # ОБЯЗАТЕЛЬНО: M01–M13 | межмодульный |
  #     # уровень Конституции | вне схемы M01–M13 | "не определено".
  #     # «не определено» порождает открытый вопрос, а не закрывает разметку
  #   owner_role: "не определено"       # ОБЯЗАТЕЛЬНО: выводится из области по правилу 5.2 —
  #     # термин области → ROLE-FUNCTIONAL-OWNER, межмодульный и уровня Конституции →
  #     # ROLE-PROCESS-OWNER; при области «не определено» владелец тоже «не определено»
  #   source: "со слов пользователя"    # ОБЯЗАТЕЛЬНО: со слов пользователя |
  #     # извлечено из ST-NNN | ссылка на внешний обязательный источник с редакцией
  #   term_status: candidate            # candidate | approved | deprecated
  #     # продуктовый навык approved не ставит: термин утверждает владелец области
  #   term_check_result: TERM_CANDIDATE # см. references/terms-registry.md
  #   section: 7                        # раздел, в котором термин впервые понадобился

# --- Массив product_risks ---
# Риски, которые могут повлиять на ценность или границы продукта.

product_risks: []
  # поля элемента: id, text, section

# --- Массив out_of_scope ---
# Решения об исключении из текущей версии продукта, с обоснованием в тексте.

out_of_scope: []
  # поля элемента: id, text

# --- Массив process_references ---
# Ссылки на процессную опору (Конституция СИГМА.MES+ и её редакция); все такие ссылки — только здесь.

process_references: []
  # поля элемента: id, document (например, "Конституция СИГМА.MES+"),
  # revision (например, "v0.6"), note (например, "черновик, не утверждена")
