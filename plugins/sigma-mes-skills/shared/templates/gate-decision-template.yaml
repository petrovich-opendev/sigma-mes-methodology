# gate-decision.yaml — запись решения ответственной роли по гейту.
# Решение — человеческий акт: совещание, дата, документ и успешный CI решением
# не являются. Полное описание — shared/references/gate-decision.md.
# Путь хранения: docs/product/<product-id>/gates/<GATE-NN>/decision.yaml

product_id: "<идентификатор продукта — тот же, что в description.yaml>"
version: 1                             # номер редакции решения; растёт, когда по тому же
                                       # гейту принимается новое решение
gate: GATE-01
responsible_role: ROLE-PRODUCT-OWNER
  # Ответственная роль этого гейта — из shared/references/roles-gates.md,
  # а не со слов участников.
holder: "<носитель ответственной роли из roles_declared>"
date: "<ГГГГ-ММ-ДД>"

document_status: "проект решения"   # проект решения | решение записано
  # «решение записано» — ТОЛЬКО после явной реплики носителя роли в форме
  # «решение: GO», «решение: REWORK» или «решение: STOP».
  # Реплики «согласен», «идём дальше», «ок» решением не являются.

# decision: REWORK
  # GO | REWORK | STOP; RETIRE — только при gate: GATE-05.
  # Поле ОТСУТСТВУЕТ целиком, пока document_status — «проект решения».
  # Пустым не ставится и предположением не заполняется.

# role_combination_note: "Совмещение ролей: <…> (п. 4.1)."
  # Присутствует, только если носитель ответственной роли совпадает с носителем
  # роли обязательного заключения того же гейта. Без оценки: оценивает
  # ответственная роль на гейте.

conclusions: []
  # Строка на КАЖДУЮ роль обязательного заключения этого гейта по roles-gates.md,
  # независимо от того, получено заключение или нет.
  # - role: ROLE-FUNCTIONAL-OWNER
  #   holder: "<носитель из roles_declared>"
  #   verdict: "замечания не блокируют"
  #     # замечаний нет | замечания не блокируют | есть блокирующие замечания |
  #     # не получено
  #   file: "docs/product/<product-id>/gates/GATE-01/ROLE-FUNCTIONAL-OWNER.yaml"
  #     # отсутствует, если заключение не получено
  # Рекомендательные заключения попадают сюда только фактически полученные:
  # строка «не получено» для рекомендательной роли не заводится.

admissibility:
  go_admissible: false
  reasons: []
    # Причины недопустимости GO, каждая с конкретным адресом:
    # - "не получено обязательное заключение ROLE-PROJECT-MANAGER"
    # - "блокирующее замечание F-001 в заключении ROLE-FUNCTIONAL-OWNER"
    # - "неразрешённая терминологическая коллизия OQ-002"
    # При go_admissible: true список пуст.
    # Недопустимость GO не препятствует решениям REWORK и STOP.

evidence: []
  # Доказательства со слов ответственной роли, ссылками. Навык их не выводит
  # из описания и не выдумывает: если не названы, массив пуст, и это видно.
  # - id: EV-001
  #   text: "<что это за доказательство>"
  #   link: "<ссылка на внутреннее хранилище; содержимое не копируется>"

# rationale: "<почему принято именно это решение — словами ответственной роли>"
  # Только при записанном решении. Формулировкой ИИ не заполняется.

process_references: []
  # - id: PR-001
  #   document: "Конституция СИГМА.MES+"
  #   revision: "v0.8"
  #   note: "draft_template, нормативные поля не заполнены"
