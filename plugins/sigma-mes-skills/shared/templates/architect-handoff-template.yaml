# architect-handoff.yaml — передача материалов Инициации архитектору.
# Перечень того, что уже есть, а не новый документ с новым содержанием:
# положения живут в своих документах и сюда не дублируются.
# Правила — shared/references/architect-handoff.md.
# Путь: docs/product/<product-id>/handoff/ROLE-ARCHITECT.yaml

product_id: "<идентификатор продукта>"
date: "<ГГГГ-ММ-ДД>"
from_stage: STAGE-01
to_role: ROLE-ARCHITECT
holder: "<носитель роли из roles_declared; «не назначена» либо «не назван»>"

documents: []
  # - kind: "продуктовое описание"      # продуктовое описание | предметная модель |
  #                                     # заключение к гейту | решение по гейту |
  #                                     # ответ роли | приложенный материал
  #   path: "docs/product/<product-id>/description.yaml"
  #   version: "0.4"
  #   author_role: ROLE-PRODUCT-OWNER

# gate_decision:                        # отсутствует, пока решение не записано;
#   gate: GATE-01                       # тогда причина попадает в readiness.reasons
#   decision: GO
#   date: "<ГГГГ-ММ-ДД>"
#   file: "docs/product/<product-id>/gates/GATE-01/decision.yaml"

open_requests: []
  # Все запросы к ROLE-ARCHITECT из ОБОИХ документов, включая оставшиеся без ответа:
  # незакрытый запрос — не препятствие передаче, а то, ради чего её делают.
  # - id: RR-001
  #   source_document: "description.yaml версии 0.4"
  #   text: "<что именно требуется подтвердить>"
  #   blocks: "<что стоит до ответа>"
  #   if_declined: "<что произойдёт при отрицательном ответе>"
  #   linked_statement: ST-009          # отсутствует, если связи нет
  #   status: "ожидает ответа"          # ожидает ответа | ответ получен

readiness:
  ready: false
  reasons: []
    # Невыполненные условия передачи, каждое строкой:
    # - "решение по GATE-01 не записано"
    # - "предметная модель построена по описанию версии 0.3, на гейт ушла 0.4"
    # - "запросы к ROLE-ARCHITECT из domain.yaml в перечень не собраны"
    # При ready: true список пуст. Невыполненное условие не запрещает передачу —
    # оно записывается явно, потому что скрытое отставание хуже помеченного.

not_transferred: []
  # Что сознательно не передаётся и почему — тот же перечень, что в блоке
  # «За пределами предметной модели» предметной модели.
  # - what: "макеты интерфейса и проектные решения"
  #   why: "ROLE-DEVELOPER в границах концепта; если концепт не делался — границ нет"
  # - what: "полная модель вариантов использования"
  #   why: "исполнитель дисциплины «Требования» не назначен; открытый вопрос 1"
  # - what: "тест-планы и оценка достаточности проверки"
  #   why: "зона ROLE-VERIFICATION-OWNER"
