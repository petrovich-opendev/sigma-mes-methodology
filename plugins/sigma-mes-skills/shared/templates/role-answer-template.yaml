# role-answer.yaml — ответ роли на адресованное ей: запрос роли (role_requests)
# либо открытый вопрос (open_questions). Форма одна для обоих случаев.
# Ответ не заменяет заключение к гейту и сам по себе статус положения не меняет:
# он даёт основание навыку перевести положение в «ответ роли зафиксирован» и
# записать source. Полное описание — shared/references/role-answer.md.
# Путь хранения: docs/product/<product-id>/answers/<RR-NNN>-<ROLE-CODE>.yaml
# либо answers/<OQ-NNN>-<ROLE-CODE>.yaml — по тому, на что дан ответ.

product_id: "<идентификатор продукта>"
request_id: RR-001                 # обязателен: ответ без адреса не проверяем.
                                   # RR-… — ответ на запрос роли (меняет статус
                                   # связанного положения); OQ-… — ответ на открытый
                                   # вопрос (закрывает сам вопрос). Роль сверяется
                                   # с полем role запроса либо addressed_to вопроса
request_document: "description.yaml версии <N>"   # либо "domain.yaml версии <N>",
                                                  # "research.yaml версии <N>",
                                                  # "screens.yaml версии <N>"

role: ROLE-ARCHITECT               # у запроса роли — тот же код, что в его поле role;
                                   # у открытого вопроса — тот же, что в его addressed_to
holder: "<носитель роли из roles_declared; «не назначена» либо «не назван»>"
date: "<ГГГГ-ММ-ДД>"

answer: "подтверждаю"              # подтверждаю | не подтверждаю | требуется уточнение
  # Отрицательный ответ — полноценный ответ: он закрывает запрос и запускает то,
  # что записано в поле if_declined самого запроса.
  # При «требуется уточнение» поле text обязано содержать сам вопрос роли.

text: "<ответ по существу: что именно роль подтверждает или отклоняет и при каких условиях>"

conditions: []
  # Условия, при которых ответ действует. Пустой список — ответ безусловен.
  # - "действует для версии описания 0.3 и не переносится на следующие"
  # - "область: только внешние сервисы, размещённые в том же контуре"

source: "<ссылка на основание: документ, протокол, запись в трекере, письмо>"
  # Именно это значение навык переносит в поле source положения при переводе
  # его в статус «ответ роли зафиксирован».

follow_up: []
  # Что требуется сделать после ответа. Пустой список, если ничего.
  # - "завести запрос ROLE-SECURITY-OWNER о требованиях к передаче уведомлений"
  # - "пересмотреть ST-009 после ответа: условие изменилось"
