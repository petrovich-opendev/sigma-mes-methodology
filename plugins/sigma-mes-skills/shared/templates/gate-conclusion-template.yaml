# gate-conclusion.yaml — заключение роли к гейту.
# Заключение — вход для решения ответственной роли гейта, а НЕ само решение.
# Меток GO, REWORK, STOP здесь нет ни в одном поле: см. references/gate-conclusion.md.

product_id: "<идентификатор продукта — тот же, что в description.yaml>"
version: 1                             # номер редакции заключения; растёт при повторном
                                       # заключении той же роли к тому же гейту
gate: GATE-01
role: ROLE-FUNCTIONAL-OWNER
holder: "<носитель роли из roles_declared; «не назначена» либо «не назван»>"

based_on:
  description_version: "<версия description.yaml, по которой дано заключение>"
  # domain_version: "<версия domain.yaml>"   # только при наличии предметной модели

date: "<ГГГГ-ММ-ДД>"
document_status: "проект заключения"   # проект заключения | заключение дано
  # «заключение дано» ставится ТОЛЬКО после явной реплики носителя роли
  # «даю заключение». До этого документ заключением не называется.

verdict: "замечаний нет"
  # замечаний нет | замечания не блокируют | есть блокирующие замечания
  # Выводится механически из признака blocking у findings, а не назначается:
  # хотя бы одно blocking: true -> «есть блокирующие замечания»;
  # замечания есть, все false -> «замечания не блокируют»;
  # findings пуст -> «замечаний нет».

# role_combination_note: "Совмещение ролей: заключение дано носителем ответственной
#   роли гейта (п. 4.1)."
#   # Строка присутствует, только если носитель этой роли в roles_declared совпадает
#   # с носителем ответственной роли гейта. Без оценки: оценивает ответственная роль.

findings: []
  # - id: F-001
  #   text: "<что именно недостаёт или вызывает возражение>"
  #   refers_to: [ST-018, OQ-003]   # ST- | OQ- | RR-; пустым не бывает:
  #                                 # замечание без адреса не проверяемо
  #   blocking: true                # по правилам references/gate01-checklist.md,
  #                                 # а не по впечатлению о серьёзности
  #   addressed_to: ROLE-PRODUCT-OWNER
  #   formulated_by: "ИИ"           # пользователь | ИИ

process_references: []
  # - id: PR-001
  #   document: "Конституция СИГМА.MES+"
  #   revision: "v0.8"
  #   note: "draft_template, нормативные поля не заполнены"
